spring.modulith.events.completion-mode=delete
spring.modulith.events.registry-trigger-annotation=org.springframework.modulith.events.ApplicationModuleListener
spring.modulith.events.staleness.published=10s
spring.modulith.events.staleness.processing=10s
spring.modulith.events.staleness.resubmitted=10s
spring.modulith.events.staleness.check-interval=30s
event-publication.resubmit-interval=30s
