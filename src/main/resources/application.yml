server:
  # 응답 gzip 압축 — example 로 비대한 /v3/api-docs OpenAPI JSON 의 전송 시간을 크게 줄인다(문서 로딩 DX, #788).
  # 앱 전역 응답에 적용된다(모바일 API JSON 도 함께 축소되는 이득). min-response-size 미만의 작은 응답은 압축 생략.
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,image/svg+xml
    min-response-size: 1024
  servlet:
    session:
      # admin 백오피스 세션 수명. 메인 API 체인은 STATELESS(세션 미사용)라 이 값은 admin form-login 세션에만 적용된다.
      # 환경별로 다르게: dev·staging 은 길게(개발 편의, 사실상 무제한), prod 는 짧게(24h). staging 이 prod 프로파일을
      # 공유하므로(deploy.yml) 프로파일로는 못 가른다 → env 변수로 주입한다. 미설정(로컬) 기본은 30d.
      timeout: ${ADMIN_SESSION_TIMEOUT:7d}

# 운영 백오피스(#249) + 슬랙-IP 접근 게이트(#526). 게이트가 보호하므로 enabled 를 전 환경에 둬도 안전하다 —
# /admin 은 슬랙 세션, dev/staging 도메인은 IP allowlist 로 막힌다. 로컬은 ADMIN_ENABLED=true + ADMIN_LOCAL_BYPASS=true 로 게이트 없이 본다.
admin:
  enabled: ${ADMIN_ENABLED:false}
  # dev/staging 도메인 전체를 allowlist IP 로만 연다(공개 차단). prod 는 false(실유저 공개, /admin 만 세션 게이트).
  environment-gate: ${ENV_ACCESS_GATE:false}
  # Discord 슬래시커맨드 Ed25519 검증 공개키(hex — GitHub secret). 비면 Discord 진입이 거부돼 게이트를 못 열고 /admin 은 404 유지.
  discord-public-key: ${DISCORD_PUBLIC_KEY:}
  # 백오피스 접근 허용 Discord userId 목록(콤마 구분). 슬래시커맨드 실행자가 여기 없으면 grant 링크 미발급.
  discord-admin-user-ids: ${DISCORD_ADMIN_USER_IDS:}
  # admin 인터랙션 허용 Discord 채널 id. 이 채널 밖 슬래시커맨드는 거부(원타임링크·대시보드 조회를 admin 채널로 국한). 비면 전부 거부.
  discord-admin-channel-id: ${DISCORD_ADMIN_CHANNEL_ID:}
  # 주간 지표 리포트를 게시할 Discord 채널 id(비민감 — 채널 id 는 secret 아님).
  discord-metrics-channel-id: ${DISCORD_METRICS_CHANNEL_ID:}
  # Discord Bot API 인증 토큰(민감 — GitHub secret). 주간 리포트 채널 게시에 사용. 비면 게시 skip.
  discord-bot-token: ${DISCORD_BOT_TOKEN:}
  # 이 앱이 도는 환경(dev/staging/prod). grant 토큰 env 바인딩 검증용.
  environment: ${ADMIN_ENVIRONMENT:}
  # grant 토큰 HMAC 서명 공유키(전 환경 동일 secret). 발급 env(인터랙션 엔드포인트)와 소비 env(링크 클릭)가 달라도 검증되게 한다.
  grant-signing-key: ${ADMIN_GRANT_SIGNING_KEY:}
  # env → admin 접속 호스트. 선택한 env 의 grant 링크 host 로 쓴다 (공개 도메인이라 secret 아님).
  grant-hosts:
    dev: https://dev.api.piki.day
    staging: https://staging.api.piki.day
    prod: https://api.piki.day
  # 허용 IP sliding TTL(무활동 만료, IP 변동 흡수). grant-token 은 원타임 링크 수명.
  allowlist-ttl: ${ADMIN_ALLOWLIST_TTL:1h}
  grant-token-ttl: 3m
  # 로컬에서만 /admin 게이트(AdminAccessFilter) 우회. 배포 환경은 항상 false.
  local-bypass: ${ADMIN_LOCAL_BYPASS:false}

spring:
  application:
    # telemetry 식별자(메트릭 application 라벨·trace service.name 이 여기서 파생). 3서비스 스킴
    # piki-core·piki-extractor·piki-renderer 로 통일(#724). 전환기 대시보드는 PIKI|piki-core 양쪽 매칭.
    name: piki-core
  config:
    # .env 다음에 .env.local 을 읽어 로컬 개인 override 를 덮어쓴다(뒤가 우선). 둘 다 optional·gitignore.
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:piki}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:piki}
    password: ${DB_PASSWORD:piki}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # 마이그레이션이 전부 additive(순서 무관)이므로 머지 순서와 timestamp 순서가 어긋나도 안전하게 적용한다.
    # 덕분에 머지 직전 timestamp 재발급이 불필요. 순서 의존이 필요한 변경은 단계 배포로 따로 다룬다.
    out-of-order: true
    # history 에는 적용 기록이 있으나 로컬엔 파일이 없는(missing) 마이그레이션의 검증 실패를 무시한다.
    # 최종 스키마 정합성은 ddl-auto:validate 가 보증한다.
    ignore-migration-patterns: "*:missing"
    # 데이터 마이그레이션이 env 별 값을 쓰도록 placeholder 주입. dicebear 기본 프로필 backfill 이
    # ${s3publicbaseurl} 로 dev/prod 버킷 URL 을 조립한다. 미설정(로컬/테스트)이면 빈 값 → 해당 SQL 은 가드로 no-op.
    # 키는 lowercase 로 둔다 — camelCase 는 Spring relaxed-binding 정규화로 Flyway 에 전달이 어긋난다.
    placeholders:
      s3publicbaseurl: ${s3.public-base-url}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  # secret 은 환경변수로만 주입한다 (default 없음). 운영에서 env 누락 시 부팅 실패가 의도.
  secret: ${JWT_SECRET}
  # Spring 의 Duration 파싱은 1h / 14d / 30m / PT1H30M 등 다양한 형식 지원.
  access-token-expiry: ${JWT_ACCESS_EXPIRY:15m}
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:14d}
  # refresh 회전 후 이전 토큰을 멱등 유효 처리하는 grace 창 (Auth0 reuse_interval 권장치와 동일).
  refresh-token-grace: ${JWT_REFRESH_GRACE:10s}

auth:
  cookie:
    # 토큰 쿠키의 Secure 속성. 운영(HTTPS)은 true, 로컬(HTTP)은 .env 의 COOKIE_SECURE=false 로 끈다.
    # 누락 시 기본 true (fail-safe-secure).
    secure: ${COOKIE_SECURE:true}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
  apple:
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    client-id: ${APPLE_CLIENT_ID:}
    bundle-id: ${APPLE_BUNDLE_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    redirect-uri: ${APPLE_REDIRECT_URI:}
    web-callback-url: ${APPLE_WEB_CALLBACK_URL:}

product:
  extract:
    remote:
      # 파싱(링크·이미지)의 유일 경로인 원격 추출 서비스(extractor) 주소. 기본값을 두지 않는다 —
      # env 누락이 localhost 등으로 조용히 흘러 모든 파싱이 런타임에만 실패하는 침묵 창을 만들지 않고,
      # 부팅에서 즉시 실패시킨다(RemoteExtractionHttpClientConfig). 로컬 dual-boot 는 .env 의
      # EXTRACT_REMOTE_BASE_URL=http://localhost:8090 으로 명시한다(.env.example 참고).
      base-url: ${EXTRACT_REMOTE_BASE_URL:}

s3:
  # 크롭한 상품 이미지 저장 버킷. 자격증명은 EC2 instance role / 로컬 환경변수(DefaultCredentialsProvider).
  bucket: ${S3_BUCKET:}
  region: ${S3_REGION:ap-northeast-2}
  public-base-url: ${S3_PUBLIC_BASE_URL:}

image:
  proxy:
    # CORS 우회 이미지 프록시 허용 도메인 목록. 서브도메인 포함 (host == domain || host.endsWith(".domain")).
    allowed-domains:
      - msscdn.net         # 무신사
      - pstatic.net        # 네이버 / 스마트스토어
      - kakaocdn.net       # 카카오
      - coupangcdn.com     # 쿠팡
      - thumbnail.10x10.co.kr
      - image.29cm.co.kr
      - image.ably.team
      - static.zara.com
      - lp2.hm.com
    max-bytes: 5242880     # 5 MB
    timeout-seconds: 10

notification:
  # 알림 보존 기간(일). 생성 후 이 기간을 넘긴 알림은 N일 자동삭제 스케줄러(NotificationCleanupScheduler)가 하드삭제한다.
  retention-days: ${NOTIFICATION_RETENTION_DAYS:14}
  # 자동삭제 스케줄(cron, KST/Asia/Seoul). 기본 매일 04:00 KST. NotificationCleanupScheduler 의 @Scheduled(zone=Asia/Seoul) placeholder 가 참조한다.
  cleanup-cron: ${NOTIFICATION_CLEANUP_CRON:0 0 4 * * *}

# API 레퍼런스 문서 노출 게이트 — dev 만 노출, staging/prod 는 404 (deploy.yml 이 dev 만 SPRINGDOC_ENABLED=true).
# spec(springdoc.api-docs.enabled)·static Stoplight UI·루트 리다이렉트(docs.enabled → WebConfig)가 이 플래그를 공유한다.
# 기본값을 fail-closed(false)로 둔다 — deploy.yml 의 변수 전달이 빠지거나 새 배포 경로가 생겨도 문서가 조용히
# 노출되지 않는다. 노출은 dev 배포(SPRINGDOC_ENABLED=true)·로컬(test application.yml 이 명시 true)에서만 켠다.
docs:
  enabled: ${SPRINGDOC_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        # 노출: health(상태), prometheus(메트릭 scrape), loggers(런타임 로그 레벨 변경).
        # info·metrics·env 등 나머지 actuator 엔드포인트는 노출하지 않는다 (info 는 contributor 가
        # 없어 빈 응답이라 노출 표면만 늘릴 뿐이고, Alloy 도 prometheus·health 만 긁는다).
        # loggers 는 비-API 인증 로그(평소 DEBUG)를 조사 시 런타임에 켜기 위함. POST 로 동작을 바꾸는
        # WRITE 엔드포인트라, 외부(nginx 443)가 /actuator/ 를 403 으로 차단해 localhost(박스)에서만 도달한다.
        # 외부 차단 + EC2 내부 Grafana Alloy 만 localhost 로 /actuator/prometheus 를 scrape 하는 2층 구조.
        include: health, prometheus, loggers
  metrics:
    tags:
      # Grafana Cloud 에서 서비스 단위로 메트릭을 구분하는 공통 라벨.
      application: ${spring.application.name}
  tracing:
    sampling:
      # 모든 응답·로그에 traceId 가 빠짐없이 찍히고 모든 요청이 trace 로 export 되도록 1.0 으로 둔다
      # (기본 0.1 이면 일부 요청만 추적). 트래픽이 커져 GC Traces 볼륨·비용이 부담되면 그때 하향한다.
      probability: 1.0
    export:
      otlp:
        # span 을 OTLP 로 내보낼지 토글 (micrometer-tracing 기본 true). 로컬엔 수집기(Alloy)가 없어 끈다 —
        # 운영 docker run 에만 TRACING_OTLP_ENABLED=true 를 준다 (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 와 같은 env override 패턴).
        # off 여도 trace 생성·전파(traceId·MDC·로그 correlation)는 그대로다 — export 단계만 끈다.
        enabled: ${TRACING_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          # export on 일 때 span 을 보낼 OTLP(HTTP/protobuf, 기본 transport=http) endpoint.
          # 앱 컨테이너(bridge)에서 호스트의 Alloy(otelcol.receiver.otlp, --network host)로 보내려면
          # 컨테이너→호스트 게이트웨이를 거쳐야 한다 (컨테이너 안 localhost 는 자기 자신이라 호스트 Alloy 에 안 닿는다).
          # deploy.yml 이 앱 docker run 에 --add-host=host.docker.internal:host-gateway 를 주고 이 endpoint 로 보낸다.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://host.docker.internal:4318/v1/traces}

logging:
  # 구조화(ECS JSON) 출력은 여기 배선 없이 운영 docker run 의 Spring 표준 env
  # LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs 가 relaxed binding 으로 직접 켠다 (extractor 와 동일 패턴, #783).
  # 켜지면 Alloy 가 trace.id·log.level·message 등 필드를 파싱해 trace 를 Loki structured metadata 로
  # 승격하고 본문은 message 만 남긴다(#364). 로컬은 env 미설정이라 구조화 off → 아래 평문 패턴 적용.
  pattern:
    # 아래 평문 패턴은 구조화 off(로컬)일 때만 적용된다 — 구조화가 켜지면(위 env) 이 패턴은 무시된다.
    # 운영 로그는 Grafana(Loki)에서 본다. Grafana 가 줄 앞에 수집시각(KST)+레벨을 자동으로 붙이므로,
    # Spring Boot 기본 콘솔 패턴의 시각·레벨과 겹쳐 한 줄에 시각·레벨이 두 번씩 나온다. 게다가 운영 컨테이너
    # JVM 은 UTC 라 Spring 시각이 Grafana 의 KST 표시와 9시간 어긋나 더 헷갈린다.
    #
    # 그래서 콘솔 패턴을 직접 정의한다:
    #  - 시각을 Asia/Seoul 로 고정해 Grafana 표시(KST)와 맞춘다 (JVM 타임존은 안 건드린다 — now() 등 도메인 시각에
    #    영향 주지 않도록 로그 출력에서만 KST 로 포맷. DB 는 serverTimezone=UTC 유지).
    #  - PID·--- ·application name([piki-core])을 뺀다. 단일 컨테이너라 PID 는 항상 1 이고, 서비스 구분은 Loki 의
    #    container 라벨(piki-core-blue/green)이 이미 한다 — 줄마다 반복할 가치가 없다.
    #  - traceId/spanId 는 한 요청의 전체 로그를 묶는 추적 키라 유지한다 (sampling 1.0 이라 항상 채워진다).
    #  - userId(MDC, JwtAuthenticationFilter 가 인증 요청에 주입)는 한 유저의 여러 요청을 가로질러 묶는 키다 —
    #    grep userId=<uuid> 로 로그인→플레이→… 여정 전체를 잇는다. 미인증 요청은 '-' 로 비워진다.
    #    (prod ECS JSON 은 MDC 를 필드로 자동 출력하므로 이 평문 패턴에만 명시한다.)
    # 색상(%clr)은 쓰지 않는다 — non-TTY(컨테이너 stdout)에선 어차피 plain 이고, 로컬 콘솔 색상보다 패턴 단순함을 택한다.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS, Asia/Seoul} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] [user=%X{userId:-}] %logger{36} : %msg%n%wEx"

# 에러 트래킹(#608). prod·staging 에만 DSN 을 주입해 켠다 — 빈 DSN 이면 SDK 가 no-op 이라 dev/로컬은 자동 off 다(코드 분기 0).
# error 로그를 sentry-logback appender 가 Sentry 이슈로 그룹핑한다(우리 예외는 GlobalExceptionHandler 가 잡아
# log.error(.., e) 로 남기므로 MVC 미처리예외 통합이 아니라 로그 캡처가 주 경로). 트레이싱은 Sentry 가 아니라
# 기존 OTel→Tempo 가 담당하므로 traces-sample-rate=0. PII(헤더·쿠키·바디)는 자동 수집하지 않고, 안전 컨텍스트만
# SentryContextEventProcessor 가 명시 부착한다(traceId·userId·adminActor·endpoint·provider 태그 + URL 쿼리스트링 마스킹).
sentry:
  dsn: ${SENTRY_DSN:}
  # staging·prod 가 같은 prod 프로파일을 공유하므로(deploy.yml) environment 는 별도 env 로 가른다(ENV_ACCESS_GATE 와 동일 패턴).
  environment: ${SENTRY_ENVIRONMENT:local}
  # 릴리즈 식별자 — prod promote 는 semver(v1.0.1), 그 외는 배포 커밋 sha (deploy.yml 이 주입). suspect commit·
  # regression 탐지에 쓰인다(GitHub 연동 승인 후 활성). Sentry UI 에 prod 는 v1.0.1 로, dev/staging 은 sha 로 보인다.
  release: ${SENTRY_RELEASE:}
  # Sentry 트레이싱 미사용(Tempo 와 중복·비용 방지). 에러 캡처만 한다.
  traces-sample-rate: 0
  # 헤더·쿠키·바디 자동 수집 off. 안전 컨텍스트만 EventProcessor 가 명시 부착한다(CLAUDE.md PII 정책).
  send-default-pii: false
  logging:
    # appender 가 이벤트화할 최소 레벨 — error(예상 못한 서버 버그·SERVER_ERROR 5xx)만 Sentry 이슈로 올린다.
    # sentry-logback 은 warn 을 예외 유무와 무관하게 전부 이벤트화해(노이즈·쿼터), warn 까지 올리면 진짜 장애(error)가
    # 묻힌다 → error 로 둔다(CodeRabbit #609 리뷰 반영). warn 레벨 외부 일시실패(Gemini retryable 등)는 이벤트가 아니라
    # breadcrumb(아래 info+)으로 남아 error 이벤트의 맥락으로 따라붙고, 추세는 Loki·Prometheus 로 본다.
    minimum-event-level: error
    minimum-breadcrumb-level: info
