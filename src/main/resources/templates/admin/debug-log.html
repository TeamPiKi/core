<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>DEBUG 로그 · PiKi 백오피스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
  <style>
    :root { --accent:#0EA5E9; --accent-soft:#E0F2FE; --ink:#111827; --muted:#6b7280; --border:#e5e7eb; --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; }
    *{box-sizing:border-box;} body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#f7f8fa;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;}
    .wrap{max-width:720px;margin:0 auto;padding:28px 24px;}
    h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 18px;}
    .ok{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:16px;}

    .guide{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px;}
    .guide>summary{list-style:none;cursor:pointer;padding:13px 16px;font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:9px;}
    .guide>summary::-webkit-details-marker{display:none;}
    .guide>summary::before{content:"\25B8";display:inline-block;color:var(--accent);font-size:15px;line-height:1;transition:transform .15s;}
    .guide[open]>summary::before{transform:rotate(90deg);}
    .guide>summary:hover{background:var(--accent-soft);}
    .gbody{border-top:1px solid var(--border);}
    .gtable{width:100%;border-collapse:collapse;font-size:12.5px;}
    .gtable th{width:104px;text-align:left;vertical-align:top;padding:11px 15px;border-bottom:1px solid #f1f3f5;color:#384049;font-size:12px;font-weight:700;white-space:nowrap;}
    .gtable td{padding:11px 15px 11px 0;border-bottom:1px solid #f1f3f5;color:var(--muted);line-height:1.65;}
    .gtable tr:last-child th,.gtable tr:last-child td{border-bottom:none;}

    .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
    .env{display:inline-block;font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-family:ui-monospace,Menlo,monospace;}
    .row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .row .label{font-size:13px;font-weight:700;}
    .row .label{font-size:14px;font-weight:800;}

    .switch{position:relative;display:inline-block;width:52px;height:30px;flex:none;}
    .switch input{opacity:0;width:0;height:0;position:absolute;}
    .switch .knob{position:absolute;inset:0;background:#d1d5db;border-radius:999px;cursor:pointer;transition:background .15s;}
    .switch .knob::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s;}
    .switch input:checked+.knob{background:var(--accent);}
    .switch input:checked+.knob::before{transform:translateX(22px);}
    .switch input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:2px;}
    code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f3f4f6;border-radius:4px;padding:1px 5px;}
  </style>
</head>
<body>
  <div th:replace="~{admin/fragments :: topbar('/admin', '← 홈')}"></div>
  <div class="wrap">
    <h1>DEBUG 로그</h1>

    <details class="guide">
      <summary>동작 방식</summary>
      <div class="gbody">
        <table class="gtable">
          <tbody>
            <tr>
              <th>대상</th>
              <td><code>com.depromeet.piki</code> · 라이브러리 제외</td>
            </tr>
            <tr>
              <th>반영</th>
              <td>즉시 · <span class="env" th:text="${environment}">local</span> 에만</td>
            </tr>
            <tr>
              <th>유지</th>
              <td>재배포 시 INFO 까지로 자동 복귀</td>
            </tr>
          </tbody>
        </table>
      </div>
    </details>

    <div class="ok" th:if="${param.updated}">반영 완료</div>

    <div class="card">
      <div class="row">
        <div class="label">
          DEBUG 로그 출력
        </div>
        <form method="post" th:action="@{/admin/debug-log}" style="margin:0;">
          <label class="switch">
            <input type="checkbox" name="debugOn" value="true" th:checked="${debugOn}" onchange="this.form.submit()" aria-label="DEBUG 로그 스위치">
            <span class="knob"></span>
          </label>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
