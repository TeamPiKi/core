<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>PiKi 운영 백오피스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
  <style>
    :root { --accent:#0EA5E9; --accent-soft:#E0F2FE; --ink:#111827; --muted:#6b7280; --border:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; background:#f7f8fa; color:var(--ink); }
    .bar { display:flex; align-items:center; gap:12px; padding:14px 24px; background:#fff; border-bottom:1px solid var(--border); }
    .brand { font-weight:800; font-size:17px; letter-spacing:-.03em; }
    .brand .dot { color:var(--accent); }
    .spacer { flex:1; }
    .who { font-size:13px; color:var(--muted); }
    .who b { color:var(--ink); }
    .logout { font-size:13px; color:var(--muted); text-decoration:none; font-weight:600; border:1px solid var(--border);
              border-radius:8px; padding:6px 12px; background:none; cursor:pointer; font-family:inherit; }
    .wrap { max-width:880px; margin:0 auto; padding:32px 24px; }
    .sec + .sec { margin-top:32px; }
    .sec h2 { font-size:17px; font-weight:800; letter-spacing:-.02em; margin:0 0 12px; }
    /* auto-rows:1fr — 설명 길이가 달라도 행 높이를 맞춰 카드가 들쭉날쭉해지지 않게. */
    .grid { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:14px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px 18px 16px; }
    .card.soon { opacity:.6; }
    .card .t { font-weight:800; font-size:15px; margin-bottom:4px; }
    .card .d { font-size:13px; color:var(--muted); }
    .tag { display:inline-block; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft);
           padding:2px 8px; border-radius:999px; margin-left:6px; }
  </style>
</head>
<body>
  <div th:replace="~{admin/fragments :: topbar(null, null)}"></div>

  <div class="wrap">
    <section class="sec">
      <h2>알림</h2>
      <div class="grid">
        <a class="card" th:href="@{/admin/templates}" style="text-decoration:none;color:inherit">
          <div class="t">알림 템플릿</div>
          <div class="d">알림 제목/내용 수정 미리보기</div>
        </a>
        <a class="card" th:href="@{/admin/announcements}" style="text-decoration:none;color:inherit">
          <div class="t">공지</div>
          <div class="d">공지 작성, 발송, 내역</div>
        </a>
      </div>
    </section>

    <section class="sec">
      <h2>아이템 등록</h2>
      <div class="grid">
        <a class="card" th:href="@{/admin/item-quota}" style="text-decoration:none;color:inherit">
          <div class="t">아이템 등록 한도</div>
          <div class="d">계정별 한도, 전체 한도 조절</div>
        </a>
        <a class="card" th:href="@{/admin/extraction-policies}" style="text-decoration:none;color:inherit">
          <div class="t">도메인 접근 정책</div>
          <div class="d">도메인별 허락 및 차단 설정</div>
        </a>
        <a class="card" th:href="@{/admin/extraction-models}" style="text-decoration:none;color:inherit">
          <div class="t">추출 LLM 모델</div>
          <div class="d">링크, 이미지 경로별 모델 지정</div>
        </a>
        <a class="card" th:href="@{/admin/source-platforms}" style="text-decoration:none;color:inherit">
          <div class="t">도메인 표시명</div>
          <div class="d">도메인별 미리보기에 보일 이름 설정</div>
        </a>
      </div>
    </section>

    <section class="sec">
      <h2>통계</h2>
      <div class="grid">
        <a class="card" th:href="@{/admin/metrics}" style="text-decoration:none;color:inherit">
          <div class="t">운영 통계 대시보드</div>
          <div class="d">기간별 가입, 위시, 토너먼트, 리텐션, 푸시</div>
        </a>
      </div>
    </section>

    <section class="sec">
      <h2>로그</h2>
      <div class="grid">
        <a class="card" th:href="@{/admin/debug-log}" style="text-decoration:none;color:inherit">
          <div class="t">DEBUG 로그</div>
          <div class="d">서비스 로그를 DEBUG 로 켜고 끔</div>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
