<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>몰별 추출 규칙 · PiKi 백오피스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
  <style>
    :root{--accent:#0EA5E9;--accent-soft:#E0F2FE;--ink:#111827;--muted:#6b7280;--border:#e5e7eb;--danger:#b91c1c;--danger-soft:#fee2e2;--ok:#15803d;--ok-soft:#dcfce7;}
    *{box-sizing:border-box;} body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#f7f8fa;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;}
    .wrap{max-width:980px;margin:0 auto;padding:28px 24px;}
    .head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;}
    h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
    .lede{color:var(--muted);font-size:13.5px;margin:0;line-height:1.65;}
    .sp{flex:1;}
    .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;}
    .ok{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:16px;}
    .err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:16px;}
    .card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    a.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--border);text-decoration:none;color:inherit;}
    a.row:first-child{border-top:none;}
    a.row:hover{background:#f7f8fa;}
    .label{font-weight:700;font-size:14px;min-width:120px;}
    .target{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#374151;flex:1;}
    .when{font-size:12px;color:var(--muted);white-space:nowrap;}
    .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
    .badge.on{background:var(--ok-soft);color:var(--ok);}
    .badge.off{background:#f1f5f9;color:#64748b;}
    .badge.render{background:var(--accent-soft);color:#0369a1;}
    .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;}
  </style>
</head>
<body>
  <div th:replace="~{admin/fragments :: topbar('/admin', '← 홈')}"></div>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>몰별 추출 규칙</h1>
        <div class="lede">추출은 몰별 규칙, 공통 규칙, LLM 순서로 시도합니다.</div>
      </div>
      <div class="sp"></div>
      <a class="btn" th:href="@{/admin/extraction-rules/new}">규칙 추가</a>
    </div>

    <div class="ok" th:if="${param.deleted}">규칙이 삭제됐습니다.</div>
    <div class="err" th:if="${param.missing}">없는 규칙입니다.</div>

    <div class="card">
      <div class="empty" th:if="${#lists.isEmpty(rules)}">등록된 규칙이 없습니다.</div>
      <a class="row" th:each="r : ${rules}" th:href="@{/admin/extraction-rules/{id}(id=${r.id})}">
        <span class="label" th:text="${r.label}">올리브영</span>
        <span class="target" th:text="${r.target}">oliveyoung.co.kr</span>
        <span class="badge render" th:if="${r.render}">렌더</span>
        <span class="badge" th:classappend="${r.enabled} ? 'on' : 'off'" th:text="${r.enabled} ? '켜짐' : '꺼짐'">켜짐</span>
        <span class="when" th:text="${#temporals.format(r.updatedAt, 'yyyy-MM-dd HH:mm')}">-</span>
      </a>
    </div>
  </div>
</body>
</html>
