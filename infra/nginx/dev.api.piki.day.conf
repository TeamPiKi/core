# dev.api.piki.day nginx 설정 — dev EC2 전용
#
# 이 파일이 배포 시 EC2 /etc/nginx/sites-available/dev.api.piki.day 로 복사되고,
# nginx -t 검증을 통과해야 reload 된다 (.github/workflows/deploy.yml).
#
# prod conf(api.piki.day.conf)와 동일 구조를 유지한다 — 별도 파일이라 한쪽에만 설정이
# 빠지는 드리프트가 생기기 쉽다. dev 가 prod 의 상위집합이 되도록(prod 에 있는 건 dev 에도 있게) 맞춘다.
# 환경 고유 차이는 server_name 과 ssl_certificate 경로의 도메인 문자열뿐이다.
# piki.day 도메인으로 전환 시 그 도메인 문자열만 교체하면 된다.
#
# 동적·서버 의존 요소는 이 레포가 관리하지 않고 경로로 참조만 한다:
#   - /etc/nginx/piki-upstream.conf : deploy.yml 이 blue/green 전환 때 런타임에 생성하는 상태 파일
#                                      (server localhost:8080 | 8081). IaC 대상 아님.
#   - /etc/letsencrypt/*             : certbot 이 발급·자동 갱신하는 TLS 키·인증서 (비밀). git 금지.
#
# SSL 인증서 최초 발급 (dev EC2 접속 후):
#   sudo certbot --nginx -d dev.api.piki.day

upstream piki {
    include /etc/nginx/piki-upstream.conf;
}

# 전역 IP 그물 - 명백한 폭주만 컷. 정밀 제어는 계정별 quota(#339)
# 조이지 말 것 - 웹은 프론트 프록시 뒤라 사용자 전원이 한 IP 로 묶인다(#928)
limit_req_zone $binary_remote_addr zone=piki_general:10m rate=20r/s;

limit_req_status 429;   # 기본 503 대신

server {
    # dev.api.piki.day 단독 (#488 retire 완료 — depromeet 도메인 제거). 인증서도 piki.day 단독(아래 ssl_certificate).
    server_name dev.api.piki.day;

    client_max_body_size 25M;

    # 공통 proxy 설정 — 아래 proxy_pass location 들이 상속한다(actuator 403 location 은 프록시하지 않아 무관).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 업스트림이 내려보낸 Location 의 scheme 을 https 로 되돌린다.
    # 앱은 forward-headers-strategy 가 없어 X-Forwarded-Proto 를 보지 않고 요청을 평문 HTTP 로 인식한다
    # (SessionCookieConfig 주석의 그 사정). 그래서 sendRedirect / `redirect:` 가 만드는 절대 Location 이
    # http:// 로 나가고, 브라우저는 그 http 홉에 Secure 쿠키(백오피스 세션)를 싣지 못한다. grant 링크를
    # 열자마자 /admin 이 404 로 튕기던 원인이다 (#1016. Safari 는 즉사, Chrome 계열은 https 자동 승격에
    # 가려져 한동안 정상으로 보였다).
    # 앱이 아니라 여기서 고치는 이유: forward-headers-strategy 는 X-Forwarded-For 신뢰까지 함께 켜서
    # ClientIp 의 allowlist 게이트 판정(append 되는 XFF 를 버리고 X-Real-IP 만 신뢰)을 흔든다. 그건 별도
    # 결정이라, 여기서는 Location 헤더 하나만 국소 수정한다.
    # $host 로 못박아 우리 호스트로의 리다이렉트만 승격한다(외부 호스트 Location 은 그대로 둔다).
    proxy_redirect http://$host/ https://$host/;

    # nginx 기본값(60s). 추출이 @Async 워커로 빠져 요청 스레드를 길게 잡는 동기 외부 호출이 없어 60s 로 충분하다 (prod conf 와 동일 근거).
    proxy_read_timeout 60s;

    # 클라이언트 타임아웃 - 미설정이면 nginx 기본 60s 라 Slowloris 에 넉넉한 창이 된다
    # header 가 유일한 방어 - limit_req·limit_conn 은 헤더를 다 읽은 뒤 평가돼 미완성 연결엔 안 닿는다
    # body·send 는 총 시간이 아니라 read/write 사이 간격 - 느린 회선의 25M 업로드도 안 끊긴다
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 10s;
    reset_timedout_connection on;   # 끊은 연결을 RST 로 즉시 반환

    # actuator 엔드포인트는 외부에 노출하지 않는다. 메트릭(/actuator/prometheus)·health 는
    # EC2 내부의 Grafana Alloy 가 localhost 컨테이너 포트로 직접 scrape 하므로 nginx 를 거치지 않는다.
    # ^~ 접두어 매칭이 아래 정규/일반 `location /` 보다 우선해, /actuator/* 외부 요청은 앱까지 가지 않고 여기서 끊긴다.
    # `^~ /actuator/` 는 슬래시로 끝나는 prefix 라 슬래시 없는 부모 경로 `/actuator`(actuator 인덱스)는
    # 안 잡혀 location / 로 새어 나간다. `= /actuator` 정확 매칭을 따로 둬 그 구멍을 막는다.
    location = /actuator {
        return 403;
    }
    location ^~ /actuator/ {
        return 403;
    }

    # 레이트리밋 초과(429)를 ApiResponseBody 모양 JSON 으로 내린다 (위 limit_req_status 429 와 짝).
    # nginx 가 앱 앞에서 끊어 GlobalExceptionHandler 를 못 거치므로, 클라이언트가 "모든 응답=ApiResponseBody"
    # 로 파싱해도 깨지지 않게 같은 스키마({data, detail, pageResponse})를 고정 JSON 으로 흉내낸다.
    # 주의: ApiResponseBody 필드가 바뀌면 이 JSON 도 손으로 맞춰야 한다(컴파일러가 못 잡는 drift).
    # 완전한 해법은 후속 userId 앱 레이어 레이트리밋(GlobalExceptionHandler 가 진짜 ApiResponseBody 를 만든다).
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"data":null,"detail":"요청이 너무 잦습니다. 잠시 후 다시 시도해 주세요.","pageResponse":{"nextCursor":null,"hasNext":false}}';
    }

    # SSE 실시간 알림 구독 — text/event-stream 스트림이라 전용 설정이 필요하다(앱: GET /api/v1/notifications/subscribe).
    # - proxy_http_version 1.1: nginx 가 백엔드에 붙는 기본값은 1.0 인데, 1.0 은 chunked 스트리밍이 안 돼
    #   SSE 가 버퍼링되거나 끊긴다. 1.1 로 올린다. 다른 경로 동작을 안 건드리도록 server 전역이 아니라 이 location 한정으로 둔다.
    # - proxy_buffering off: nginx 가 응답을 모았다 내보내면 실시간성이 깨진다. 이벤트를 받는 즉시 클라이언트로 흘려보낸다.
    # 공통 proxy_set_header / proxy_read_timeout 60s 는 server 레벨에서 상속한다(앱 하트비트가 30s 라 60s read_timeout 은 안 끊긴다).
    # 정확매칭(=)이라 catch-all(location /)보다 우선한다. 레이트리밋은 일반 그물(piki_general) 유지 — 구독은 오래 열린 1요청이라 카운트 1로 무해하다.
    location = /api/v1/notifications/subscribe {
        limit_req zone=piki_general burst=40 nodelay;
        proxy_pass http://piki;
        proxy_http_version 1.1;
        proxy_buffering off;
        send_timeout 60s;   # 전역 10s 예외 - 이벤트 없으면 30s 하트비트가 유일한 쓰기(SseHeartbeatScheduler 와 함께 움직인다)
    }

    # --- 경로 화이트리스트 (#827): 이 서버는 우리 클라이언트(앱·웹·어드민)만 호출하는 API 서버라
    # 정당한 표면이 좁고 명확하다. 아래 명시 경로만
    # 앱으로 프록시하고, 그 외(robots.txt·sitemap·/.well-known/*·wp-*·.env 등 봇 스캔)는 444 로
    # 무응답 종료한다 — 앱 트래픽·로그가 0 이 되고(도입 전 실측: core 로그의 33%가 스캔), 스캐너에게
    # 아무 정보도 주지 않는다. SG 는 앱 클라이언트가 임의 IP 라 443 을 못 좁히므로 nginx 가 차단층이다.
    # 주의: 앱에 새 루트 경로(/api 밖)를 추가하면 이 화이트리스트에도 함께 추가해야 한다.

    # 공개 JSON API 전부(Apple 콜백·SSE 구독·dev 도구 포함) — 전역 느슨한 그물(piki_general).
    location /api/ {
        limit_req zone=piki_general burst=40 nodelay;
        proxy_pass http://piki;
    }

    # 어드민 백오피스 — prefix 매칭이라 /admin·/admin/**·/admin-access 를 모두 커버한다.
    # 접근 게이트(IP allowlist·Discord 승인)는 앱(EnvironmentAccessFilter)이 소유한다.
    location /admin {
        limit_req zone=piki_general burst=40 nodelay;
        proxy_pass http://piki;
    }

    # /health 는 박스 자신(127.0.0.1)에게만 연다 - 배포(slot_switch)가 전환 직후 "프론트 → nginx → 새 슬롯"
    # 경로를 검증하는 용도다. 외부는 종전(#833)대로 봇 스캔에 상태코드조차 안 주는 444 를 유지한다
    # ("외부 uptime 모니터 도입 시 재개방" 조건과 별개 - 이건 외부 개방이 아니다).
    # if+return 은 rewrite phase 라 limit_req 를 안 타지만, 내부 1회성 검증이라 레이트리밋이 불필요하다.
    location = /health {
        if ($remote_addr != "127.0.0.1") { return 444; }
        proxy_pass http://piki;
    }

    # 어드민 페이지가 참조하는 유일한 정적 리소스.
    location = /favicon.ico {
        limit_req zone=piki_general burst=40 nodelay;
        proxy_pass http://piki;
    }

    # API 문서(Stoplight Elements + OpenAPI spec) — SPRINGDOC_ENABLED 가 dev 전용이라 dev conf 에만 둔다.
    location /docs/ {
        limit_req zone=piki_general burst=40 nodelay;
        proxy_pass http://piki;
    }
    location /v3/api-docs {
        limit_req zone=piki_general burst=40 nodelay;
        proxy_pass http://piki;
    }

    # 그 외 전부 — 444 는 nginx 특수 코드로, 응답 없이 연결을 닫는다(스캐너에 상태코드조차 안 준다).
    location / {
        return 444;
    }

    # http2: 브라우저는 origin 당 커넥션을 약 6개로 제한하는데, SSE 가 그 중 1개를 계속 점유한다.
    # 멀티탭·요청 많은 화면에서 HTTP/2 의 스트림 multiplexing 이 이 제한을 풀어 SSE 가 다른 요청을 굶기지 않게 한다
    # (백엔드 leg 와 무관한 클라이언트↔nginx leg 최적화). 단일 탭 해피케이스에선 이득이 작지만 켜는 비용도 0 에 가깝다.
    # 형식 주의: nginx 1.25.1+ 는 `http2 on;` 지시어를 선호하나, 이 `listen ... http2` 파라미터 형식도 동작한다
    # (신버전은 deprecation 경고만, nginx -t 는 통과). 운영 nginx 버전에 맞춰 추후 `http2 on;` 으로 바꿔도 된다.
    listen 443 ssl http2;
    # 인증서 — dev.api.piki.day 단독 (#488 retire). depromeet SAN 제거 후 piki.day 단독으로 재발급.
    ssl_certificate /etc/letsencrypt/live/dev.api.piki.day/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.api.piki.day/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = dev.api.piki.day) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dev.api.piki.day;
    return 404;
}
