# Ubuntu nginx 패키지 기본 nginx.conf 에서 연결 한도·파일 수 한도·연결 상태 페이지만 바꾼 정본. 배포가 /etc/nginx/nginx.conf 를 덮어쓴다.
user www-data;
worker_processes auto;
# systemd 기본 soft 한도(1024)가 worker_connections 를 막는다. 워커가 권한을 내리기 전에 적용된다.
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	# SSE 사용자 한 명이 클라이언트 쪽과 앱 쪽 연결 2개를 잡는다. 연결이 워커 하나에 몰려도 약 2,000명까지 받는다.
	worker_connections 4096;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;

	gzip on;

	# 연결 수 수집(piki-nginx-exporter)용. 배포가 sites-enabled 의 다른 파일을 지우므로 사이트 파일이 아니라 여기에 둔다.
	server {
		listen 127.0.0.1:9112;
		access_log off;
		location = /stub_status {
			stub_status;
		}
		location / {
			return 404;
		}
	}

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
