# staging EC2 전원 버튼 — staging 은 QA 할 때만 켠다(평소 stopped, 비용 절약).
# Actions 탭에서 on/off/status 를 골라 실행하면 결과가 run summary 에 표로 남아
# "지금 켜져 있나?" 를 코드·콘솔 없이 확인할 수 있다.
#
# 자격증명: EC2 start/stop 한정 최소권한 IAM 사용자(piki-staging-power)의 키를 repo secrets 로 주입.
#   start/stop 은 Name=team3-staging-app 태그 조건으로만 허용돼(IAM policy) 다른 인스턴스는 못 건드린다.
# 인스턴스는 ID 하드코딩 대신 Name 태그로 조회한다 — terraform 재생성으로 ID 가 바뀌어도 워크플로는 그대로다.
# EIP 가 붙어 있어 stop/start 를 반복해도 staging.api.piki.day 의 IP 는 유지된다.
name: Staging Power

on:
  workflow_dispatch:
    inputs:
      action:
        description: "staging EC2 를 어떻게 할까"
        required: true
        type: choice
        options: [status, on, off]
        default: status

permissions: {}

jobs:
  power:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_POWER_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_POWER_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
      NAME_TAG: team3-staging-app
      HEALTH_URL: https://staging.api.piki.day/health
    steps:
      - name: staging 전원 ${{ inputs.action }}
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME_TAG" \
            --query 'Reservations[].Instances[?State.Name!=`terminated`][].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::Name=$NAME_TAG 인스턴스를 찾지 못함"; exit 1
          fi

          state() {
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text
          }

          case "${{ inputs.action }}" in
            on)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              # 컨테이너들은 --restart unless-stopped 라 부팅과 함께 자동 기동된다. 앱이 실제로 응답할 때까지
              # 공개 /health 를 폴링해(최대 5분) "QA 시작 가능" 시점을 summary 에 확정한다.
              HEALTH="미응답(수동 확인 필요)"
              for i in $(seq 1 30); do
                CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || true)
                if [ "$CODE" = "200" ]; then HEALTH="200 OK (QA 시작 가능)"; break; fi
                sleep 10
              done
              ;;
            off)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" > /dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              HEALTH="-"
              ;;
            status)
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || true)
              if [ "$CODE" = "200" ]; then HEALTH="200 OK"; else HEALTH="미응답($CODE)"; fi
              ;;
          esac

          STATE=$(state)
          {
            echo "## staging 전원: ${{ inputs.action }}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 인스턴스 | $INSTANCE_ID ($NAME_TAG) |"
            echo "| EC2 상태 | **$STATE** |"
            echo "| 앱 헬스 ($HEALTH_URL) | $HEALTH |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "state=$STATE health=$HEALTH"
