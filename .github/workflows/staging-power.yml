# staging EC2 전원 버튼 — staging 은 QA 할 때만 켠다(평소 stopped, 비용 절약).
# Actions 탭에서 start/stop/status 를 골라 실행하면 결과가 run summary 에 표로 남아
# "지금 켜져 있나?" 를 코드·콘솔 없이 확인할 수 있다. 실패해도 표는 남는다(trap) — 이 워크플로의 존재 이유가 그 표다.
#
# 자격증명: EC2 start/stop 한정 최소권한 IAM 사용자(piki-staging-power)의 키를 repo secrets 로 주입.
#   start/stop 은 Name=team3-staging-app 태그 조건으로만 허용돼(IAM policy) 다른 인스턴스는 못 건드린다.
# 인스턴스는 ID 하드코딩 대신 Name 태그로 조회한다 — terraform 재생성으로 ID 가 바뀌어도 워크플로는 그대로다.
# EIP 가 붙어 있어 stop/start 를 반복해도 staging.api.piki.day 의 IP 는 유지된다.
# public repo 주의: run 로그·summary 가 전세계 공개다. aws 의 에러 stderr 는 계정 ID·ARN 을 담으므로
#   버리고 고정 문구로 답하며, summary 에도 내부 식별자(인스턴스 ID)를 싣지 않는다.
name: Staging Power

on:
  workflow_dispatch:
    inputs:
      action:
        description: "staging EC2 를 어떻게 할까"
        required: true
        type: choice
        # on/off 는 YAML 1.1 불리언으로 파싱돼 허용값이 true/false 가 되는 함정(실측 422) — start/stop 으로 명명.
        options: [status, start, stop]
        default: status

permissions: {}

jobs:
  power:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_POWER_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_POWER_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
      # 셸에 ${{ }} 직접 보간 대신 env 경유 — choice 라 지금은 값이 고정이지만, 훗날 입력 타입이 완화돼도
      # 값이 데이터로만 전달돼 스크립트 인젝션 표면이 생기지 않는다(GitHub 하드닝 가이드 관례).
      ACTION: ${{ inputs.action }}
      NAME_TAG: team3-staging-app
      HEALTH_URL: https://staging.api.piki.day/health
    steps:
      - name: staging 전원
        run: |
          set -euo pipefail

          STATE="확인 실패"
          HEALTH="-"
          NOTE=""
          # 실패 경로에도 표를 남긴다 — waiter 타임아웃·전이 중 충돌은 보통 몇 분 뒤 status 재실행으로 풀리므로
          # 그 안내(NOTE)까지 표에 싣는다.
          write_summary() {
            {
              echo "## staging 전원: $ACTION"
              echo ""
              echo "| 항목 | 값 |"
              echo "|---|---|"
              echo "| 인스턴스 | $NAME_TAG |"
              echo "| EC2 상태 | **$STATE** |"
              echo "| 앱 헬스 | $HEALTH |"
              if [ -n "$NOTE" ]; then echo "| 참고 | $NOTE |"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "state=$STATE health=$HEALTH note=$NOTE"
          }
          trap write_summary EXIT

          # shutting-down(재생성 중 잔재)·terminated 는 서버측 상태 필터로 배제한다. 그래도 같은 태그가 2개 이상이면
          # (재생성 잔재 등) 어느 것을 조작할지 모호하므로 개수를 검사해 명시적으로 멈춘다 — 다중 ID 를 그대로 넘기면
          # InvalidInstanceID.Malformed 라는 엉뚱한 에러로 원인이 가려진다.
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME_TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null) \
            || { NOTE="인스턴스 조회 실패 (자격증명·리전 확인)"; exit 1; }
          COUNT=$(echo "$IDS" | wc -w)
          if [ "$COUNT" -eq 0 ]; then NOTE="Name=$NAME_TAG 인스턴스를 찾지 못함"; exit 1; fi
          if [ "$COUNT" -gt 1 ]; then NOTE="같은 태그의 인스턴스가 ${COUNT}개 (재생성 잔재?) — 콘솔에서 정리 후 재실행"; exit 1; fi
          INSTANCE_ID="$IDS"

          state() {
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null
          }
          health() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || true
          }

          case "$ACTION" in
            start)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null 2>&1 \
                || { STATE=$(state); NOTE="start 거부 — 전이 중(stopping 등)일 수 있음. 몇 분 뒤 재실행"; exit 1; }
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" 2>/dev/null \
                || { STATE=$(state); NOTE="running 대기 초과 — status 로 재확인"; exit 1; }
              # 컨테이너들은 --restart unless-stopped 라 부팅과 함께 자동 기동된다. 앱이 실제로 응답할 때까지
              # 공개 /health 를 폴링해(최대 약 7분) "QA 시작 가능" 시점을 summary 에 확정한다.
              HEALTH="미응답 — QA 시작 불가, 컨테이너 확인 필요"
              for i in $(seq 1 30); do
                if [ "$(health)" = "200" ]; then HEALTH="200 OK (QA 시작 가능)"; break; fi
                sleep 10
              done
              # 부팅 자체는 성공이라 job 은 green 으로 두되, 체크마크만 보고 QA 를 시작하지 않도록 경고를 띄운다.
              case "$HEALTH" in 미응답*) echo "::warning::staging 은 켜졌지만 앱이 응답하지 않음 — 컨테이너 상태 확인 필요" ;; esac
              ;;
            stop)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" > /dev/null 2>&1 \
                || { STATE=$(state); NOTE="stop 거부 — 전이 중(pending 등)일 수 있음. 몇 분 뒤 재실행"; exit 1; }
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" 2>/dev/null \
                || { STATE=$(state); NOTE="stopped 대기 초과(셧다운 지연) — 곧 멈춘다. status 로 재확인"; exit 1; }
              ;;
            status)
              if [ "$(health)" = "200" ]; then HEALTH="200 OK"; else HEALTH="미응답"; fi
              ;;
            *)
              # choice 가 서버측에서 검증돼 정상적으론 도달 불가 — options 를 늘리며 case 분기를 빠뜨린 편집 실수를 즉시 드러낸다.
              NOTE="알 수 없는 action: $ACTION (case 분기 누락)"; exit 1
              ;;
          esac

          STATE=$(state)
