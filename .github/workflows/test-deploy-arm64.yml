# 일회용 test-deploy — deploy 잡의 arch 민감한 핵심(JAR 빌드 + Dockerfile.ci 도커 빌드)을
# 실제 배포(SSH·push) 없이 ubuntu-24.04-arm 네이티브 러너에서 돌려, arm64 이관이 안전한지 확인한다.
# QEMU 로 느렸던 layertools extract(JVM)가 네이티브 arm64 에서 도는 걸 실증하고 빌드 시간도 잰다.
# 이 브랜치 push 로만 돈다. 확인 끝나면 이 파일은 제거한다.
name: Test Deploy (arm64)

on:
  push:
    branches: [infra/deploy-arm64-runner]

jobs:
  test-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 아키텍처 확인
        run: echo "runner arch: $(uname -m) (RUNNER_ARCH=$RUNNER_ARCH)"

      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build JAR (arm64 네이티브)
        run: |
          t0=$(date +%s)
          ./gradlew bootJar --no-daemon
          echo "bootJar 소요: $(( $(date +%s) - t0 ))s"
          ls -la build/libs/*.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 실제 deploy 와 동일하게 Dockerfile.ci 로 빌드 — extractor 스테이지의 layertools extract(JVM)가
      # 네이티브 arm64 에서 도는지 + 빌드 시간을 본다. push 는 하지 않는다(--load 로 로컬만).
      - name: Docker build Dockerfile.ci (arm64 네이티브, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          platforms: linux/arm64
          tags: piki-core:arm64-test

      - name: 결과 이미지 아키텍처 확인
        run: |
          docker image inspect piki-core:arm64-test --format 'image arch: {{.Architecture}}'
          test "$(docker image inspect piki-core:arm64-test --format '{{.Architecture}}')" = "arm64" \
            && echo "OK: 네이티브 arm64 이미지 빌드 성공" || { echo "arch 불일치"; exit 1; }
