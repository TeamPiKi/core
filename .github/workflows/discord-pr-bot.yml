name: Discord PR Bot

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - review_requested
      - review_request_removed
      - edited
      - synchronize
      - closed
  push:
    branches:
      - main

# 최소권한: 상단은 비우고 job 단위로만 필요한 것을 준다 (zizmor excessive-permissions).
permissions: {}

# 레이스 방지용 concurrency
concurrency:
  group: discord-pr-bot-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  notify-discord:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # PR 코멘트(메타데이터) 생성·이슈 상태 조회 = issues 스코프. PR 데이터는 event payload 에서 읽어 API 권한 불필요.
    permissions:
      issues: write
    env:
      # github 로그인 → discord user id 매핑(멘션용). 알림(deploy/promote)과 같은 secret 을 공유한다.
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      # 봇 토큰 — webhook 과 달리 스레드 생성/메시지 수정이 필요해 봇 토큰을 쓴다.
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_PR_CHANNEL_ID }}
      DISCORD_API: https://discord.com/api/v10

    steps:
      - name: Extract PR data
        id: pr
        shell: bash
        env:
          # 사용자 제어 값(제목·브랜치명 등)은 run 에 ${{ }} 로 직접 보간하지 않고 env 로 받는다 — 제목의 백틱·$()·따옴표가
          # 스크립트로 실행/크래시되는 인젝션을 막는다. env 값은 셸이 재파싱하지 않아 안전하다.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 멘션 맵 방어 — 미설정이면 빈 객체. `${VAR:-{}}` 는 값이 있을 때 bash 가 stray `}` 를 붙여 jq 를 깨뜨리므로 분리한다.
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "pr_title<<__PR_TITLE_EOF__"
            echo "$PR_TITLE"
            echo "__PR_TITLE_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          # 작성자 멘션: 매핑 있으면 <@discordid>, 없으면 로그인명(핑 안 감).
          AUTHOR_DISCORD_ID=$(echo "$DISCORD_USER_MAP" | jq -r --arg login "$AUTHOR_LOGIN" '.[$login] // empty')
          if [ -n "$AUTHOR_DISCORD_ID" ]; then
            AUTHOR_MENTION="<@$AUTHOR_DISCORD_ID>"
          else
            AUTHOR_MENTION="$AUTHOR_LOGIN"
          fi

          echo "author=$AUTHOR_MENTION" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Find existing Discord message/thread from PR comments
        id: find_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          COMMENTS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.pr.outputs.pr_number }}/comments")

          # 메타 주석 본문(마지막 것)에서 JSON 객체를 뽑는다. initial_reviewers 는 배열([])이라 중괄호 중첩이 없어
          # `\{[^}]*\}` 로 객체 하나를 통째로 잡을 수 있다.
          BODY=$(echo "$COMMENTS" | jq -r '.[]? | objects | select((.body // "") | contains("discord-pr-bot")) | .body' | tail -n 1)
          # 신규 PR 은 아직 메타 주석이 없어 grep 이 no-match(exit 1)로 끝난다. set -eo pipefail 이 이를 실패로 보고 스텝을
          # 죽이므로 `|| true` 로 방어한다. 없으면 META_JSON 은 빈 문자열이고, 빈 입력에 jq 를 물리면 파싱 에러가 나므로
          # META_JSON 이 있을 때만 파싱한다.
          META_JSON=$(echo "$BODY" | grep -oP 'discord-pr-bot:\s*\K\{[^}]*\}' | tail -n 1 || true)

          MESSAGE_ID=""; THREAD_ID=""; CHANNEL_ID=""; INITIAL_REVIEWERS="[]"
          if [ -n "$META_JSON" ]; then
            MESSAGE_ID=$(echo "$META_JSON" | jq -r '.message_id // empty')
            THREAD_ID=$(echo "$META_JSON" | jq -r '.thread_id // empty')
            CHANNEL_ID=$(echo "$META_JSON" | jq -r '.channel_id // empty')
            INITIAL_REVIEWERS=$(echo "$META_JSON" | jq -c '.initial_reviewers // []')
          fi

          echo "message_id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
          echo "thread_id=$THREAD_ID" >> "$GITHUB_OUTPUT"
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "initial_reviewers=$INITIAL_REVIEWERS" >> "$GITHUB_OUTPUT"

      - name: Post parent message and create thread
        if: steps.find_meta.outputs.message_id == '' && (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false
        id: post_parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          # github 로그인 → discord 멘션(매핑 없으면 @로그인명, 핑 안 감).
          mention_discord_user() {
            local github_id="$1"
            local discord_id
            discord_id=$(echo "$DISCORD_USER_MAP" | jq -r --arg id "$github_id" '.[$id] // empty')
            if [ -n "$discord_id" ]; then
              echo "<@$discord_id>"
            else
              echo "@$github_id"
            fi
          }

          build_reviewer_text() {
            local reviewers reviewer_text user_mention
            reviewers=$(jq -r '.pull_request.requested_reviewers[]?.login' "$GITHUB_EVENT_PATH")
            reviewer_text=""
            if [ -z "$reviewers" ]; then echo "없음"; return; fi
            while IFS= read -r reviewer; do
              [ -z "$reviewer" ] && continue
              user_mention=$(mention_discord_user "$reviewer")
              if [ -z "$reviewer_text" ]; then reviewer_text="$user_mention"; else reviewer_text="$reviewer_text, $user_mention"; fi
            done <<< "$reviewers"
            [ -z "$reviewer_text" ] && reviewer_text="없음"
            echo "$reviewer_text"
          }

          build_issue_text() {
            local pr_body="$1" issues issue_text num res state emoji link line
            issues=$(echo "$pr_body" | grep -oiE '\bclose[sd]?[[:space:]]+#[0-9]+' | grep -oE '#[0-9]+' | sort -u || true)
            issue_text=""
            if [ -z "$issues" ]; then echo "없음"; return; fi
            while IFS= read -r issue; do
              [ -z "$issue" ] && continue
              num=$(echo "$issue" | tr -d '#')
              res=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$num")
              state=$(echo "$res" | jq -r '.state // "unknown"')
              if [ "$state" = "open" ]; then emoji="🟢"; elif [ "$state" = "closed" ]; then emoji="⚫"; else emoji="❓"; fi
              # Discord 마크다운: 링크는 [text](url).
              link="https://github.com/${{ github.repository }}/issues/$num"
              line="$emoji [#$num]($link)"
              if [ -z "$issue_text" ]; then issue_text="$line"; else issue_text=$(printf "%s\n%s" "$issue_text" "$line"); fi
            done <<< "$issues"
            [ -z "$issue_text" ] && issue_text="없음"
            echo "$issue_text"
          }

          build_summary() {
            local pr_body="$1"
            printf '%s\n' "$pr_body" | awk '
              BEGIN { in_task=0; n=0; out="" }
              /^##/ {
                if (in_task == 1) exit
                r = $0
                sub(/^##[[:space:]]+/, "", r)
                ok = (match(r, /^[Tt][Aa][Ss][Kk]([^A-Za-z]|$)/) || match(r, /[[:space:]][Tt][Aa][Ss][Kk]([^A-Za-z]|$)/))
                if (ok) { in_task=1; next }
                next
              }
              in_task == 1 && /^##/ { exit }
              in_task == 1 {
                s = $0
                sub(/^[[:space:]]+/, "", s)
                if (s ~ /^>/) next
                if (s ~ /^-[[:space:]]*\[[[:space:]xX]\]/) next
                if (s ~ /^-[[:space:]]+/) {
                  sub(/^-[[:space:]]+/, "", s)
                  if (length(s) > 0) { if (n++ > 0) out = out "\n"; out = out "• " s }
                }
              }
              END { if (n > 0) print out; else print "요약 없음" }
            '
          }

          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          REVIEWER_TEXT=$(build_reviewer_text)
          ISSUE_TEXT=$(build_issue_text "$PR_BODY")
          SUMMARY=$(build_summary "$PR_BODY")

          TITLE_LINK="[#${{ steps.pr.outputs.pr_number }} $PR_TITLE](${{ steps.pr.outputs.pr_url }})"

          TEXT=$(cat <<EOF
          [PR] $TITLE_LINK


          🔥 연관 이슈
          $ISSUE_TEXT


          📝 작업 요약
          $SUMMARY


          **Author**: ${{ steps.pr.outputs.author }}
          **branch**: $HEAD_REF -> $BASE_REF
          **reviewer**: $REVIEWER_TEXT
          EOF
          )
          # Discord content 2000자 제한 — 넘치면 POST 가 400 → 실패. 여유 두고 1900자로 자른다 (러너 UTF-8 로케일 char 기준).
          TEXT="${TEXT:0:1900}"

          # 1) 부모 메시지 발행 → message id 확보
          RESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["users"]}}')")
          MESSAGE_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$MESSAGE_ID" ]; then
            echo "Discord parent post failed"; echo "$RESP"; exit 1
          fi

          # 2) 그 메시지에서 스레드 생성(봇 필요). 이름은 100자 제한이라 잘라 넣는다.
          THREAD_NAME=$(printf 'PR #%s %s' "${{ steps.pr.outputs.pr_number }}" "$PR_TITLE" | cut -c1-90)
          TRESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages/$MESSAGE_ID/threads" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg name "$THREAD_NAME" '{name:$name, auto_archive_duration:10080}')")
          THREAD_ID=$(echo "$TRESP" | jq -r '.id // empty')
          if [ -z "$THREAD_ID" ]; then
            echo "Discord thread create failed"; echo "$TRESP"; exit 1
          fi

          echo "message_id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
          echo "thread_id=$THREAD_ID" >> "$GITHUB_OUTPUT"

      - name: Save Discord metadata into PR comment
        if: steps.post_parent.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          INITIAL_REVIEWERS=$(jq -c '[.pull_request.requested_reviewers[]?.login]' "$GITHUB_EVENT_PATH")
          META="<!-- discord-pr-bot: {\"channel_id\":\"$DISCORD_CHANNEL_ID\",\"message_id\":\"${{ steps.post_parent.outputs.message_id }}\",\"thread_id\":\"${{ steps.post_parent.outputs.thread_id }}\",\"initial_reviewers\":$INITIAL_REVIEWERS} -->"
          # visible 안내문 + 숨겨진 metadata 주석. find_meta 의 contains("discord-pr-bot") 검색이 주석을 잡으므로 연동에 영향 없다.
          BODY=$(printf '%s\n%s' 'Discord 스레드 연동용 메타데이터입니다. discord-pr-bot 워크플로가 자동 생성하며, 수정·삭제하면 PR 과 Discord 알림 연동이 끊깁니다.' "$META")

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.pr.outputs.pr_number }}/comments" \
            -d "$(jq -n --arg body "$BODY" '{body:$body}')"

      - name: Update parent Discord message
        if: github.event.action != 'opened' && steps.find_meta.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          mention_discord_user() {
            local github_id="$1"
            local discord_id
            discord_id=$(echo "$DISCORD_USER_MAP" | jq -r --arg id "$github_id" '.[$id] // empty')
            if [ -n "$discord_id" ]; then echo "<@$discord_id>"; else echo "@$github_id"; fi
          }

          build_reviewer_text() {
            local reviewers reviewer_text user_mention
            reviewers=$(jq -r '.pull_request.requested_reviewers[]?.login' "$GITHUB_EVENT_PATH")
            reviewer_text=""
            if [ -z "$reviewers" ]; then echo "없음"; return; fi
            while IFS= read -r reviewer; do
              [ -z "$reviewer" ] && continue
              user_mention=$(mention_discord_user "$reviewer")
              if [ -z "$reviewer_text" ]; then reviewer_text="$user_mention"; else reviewer_text="$reviewer_text, $user_mention"; fi
            done <<< "$reviewers"
            [ -z "$reviewer_text" ] && reviewer_text="없음"
            echo "$reviewer_text"
          }

          build_issue_text() {
            local pr_body="$1" issues issue_text num res state emoji link line
            issues=$(echo "$pr_body" | grep -oiE '\bclose[sd]?[[:space:]]+#[0-9]+' | grep -oE '#[0-9]+' | sort -u || true)
            issue_text=""
            if [ -z "$issues" ]; then echo "없음"; return; fi
            while IFS= read -r issue; do
              [ -z "$issue" ] && continue
              num=$(echo "$issue" | tr -d '#')
              res=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$num")
              state=$(echo "$res" | jq -r '.state // "unknown"')
              if [ "$state" = "open" ]; then emoji="🟢"; elif [ "$state" = "closed" ]; then emoji="⚫"; else emoji="❓"; fi
              link="https://github.com/${{ github.repository }}/issues/$num"
              line="$emoji [#$num]($link)"
              if [ -z "$issue_text" ]; then issue_text="$line"; else issue_text=$(printf "%s\n%s" "$issue_text" "$line"); fi
            done <<< "$issues"
            [ -z "$issue_text" ] && issue_text="없음"
            echo "$issue_text"
          }

          build_summary() {
            local pr_body="$1"
            printf '%s\n' "$pr_body" | awk '
              BEGIN { in_task=0; n=0; out="" }
              /^##/ {
                if (in_task == 1) exit
                r = $0
                sub(/^##[[:space:]]+/, "", r)
                ok = (match(r, /^[Tt][Aa][Ss][Kk]([^A-Za-z]|$)/) || match(r, /[[:space:]][Tt][Aa][Ss][Kk]([^A-Za-z]|$)/))
                if (ok) { in_task=1; next }
                next
              }
              in_task == 1 && /^##/ { exit }
              in_task == 1 {
                s = $0
                sub(/^[[:space:]]+/, "", s)
                if (s ~ /^>/) next
                if (s ~ /^-[[:space:]]*\[[[:space:]xX]\]/) next
                if (s ~ /^-[[:space:]]+/) {
                  sub(/^-[[:space:]]+/, "", s)
                  if (length(s) > 0) { if (n++ > 0) out = out "\n"; out = out "• " s }
                }
              }
              END { if (n > 0) print out; else print "요약 없음" }
            '
          }

          CHANNEL_ID="${{ steps.find_meta.outputs.channel_id }}"
          MESSAGE_ID="${{ steps.find_meta.outputs.message_id }}"
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          REVIEWER_TEXT=$(build_reviewer_text)
          ISSUE_TEXT=$(build_issue_text "$PR_BODY")
          SUMMARY=$(build_summary "$PR_BODY")
          STATUS_LINE=""
          if [ "${{ github.event.action }}" = "closed" ] && [ "${{ steps.pr.outputs.merged }}" = "true" ]; then
            STATUS_LINE="✅ 머지 완료"
          elif [ "${{ github.event.action }}" = "closed" ] && [ "${{ steps.pr.outputs.merged }}" != "true" ]; then
            STATUS_LINE="🗑️ 머지 없이 종료됨"
          fi
          TITLE_LINK="[#${{ steps.pr.outputs.pr_number }} $PR_TITLE](${{ steps.pr.outputs.pr_url }})"

          TEXT=$(cat <<EOF
          [PR] $TITLE_LINK
          $STATUS_LINE

          🔥 **연관 이슈**
          $ISSUE_TEXT


          📝 **작업 요약**
          $SUMMARY


          **Author**: ${{ steps.pr.outputs.author }}
          **Branch**: $HEAD_REF -> $BASE_REF
          **Reviewer**: $REVIEWER_TEXT
          EOF
          )
          TEXT="${TEXT:0:1900}"

          RESP=$(curl -s -X PATCH "$DISCORD_API/channels/$CHANNEL_ID/messages/$MESSAGE_ID" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord update failed"; echo "$RESP"; exit 1
          fi

      - name: Reply to thread
        if: github.event.action != 'opened' && steps.find_meta.outputs.thread_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          THREAD_ID="${{ steps.find_meta.outputs.thread_id }}"
          ACTION="${{ steps.pr.outputs.action }}"
          MERGED="${{ steps.pr.outputs.merged }}"

          mention_discord_user() {
            local github_id="$1"
            local discord_id
            discord_id=$(echo "$DISCORD_USER_MAP" | jq -r --arg id "$github_id" '.[$id] // empty')
            if [ -n "$discord_id" ]; then echo "<@$discord_id>"; else echo "@$github_id"; fi
          }

          TEXT=""

          if [ "$ACTION" = "review_requested" ]; then
            REQUESTED_REVIEWER=$(jq -r '.requested_reviewer.login // ""' "$GITHUB_EVENT_PATH")
            INITIAL_REVIEWERS='${{ steps.find_meta.outputs.initial_reviewers }}'
            [ -z "$INITIAL_REVIEWERS" ] && INITIAL_REVIEWERS="[]"
            # PR open 시점에 이미 걸려 있던 리뷰어면 스레드 답글을 건너뛴다(중복 방지).
            IS_INITIAL=$(echo "$INITIAL_REVIEWERS" | jq -r --arg r "$REQUESTED_REVIEWER" 'map(. == $r) | any')
            if [ "$IS_INITIAL" = "true" ]; then
              echo "Reviewer $REQUESTED_REVIEWER was present at PR open, skipping thread reply."; exit 0
            fi
            if [ -n "$REQUESTED_REVIEWER" ]; then
              TEXT="🙋 리뷰 요청됨: $(mention_discord_user "$REQUESTED_REVIEWER")"
            else
              TEXT="🙋 리뷰 요청됨"
            fi
          elif [ "$ACTION" = "review_request_removed" ]; then
            REMOVED_REVIEWER=$(jq -r '.requested_reviewer.login // ""' "$GITHUB_EVENT_PATH")
            if [ -n "$REMOVED_REVIEWER" ]; then
              TEXT="➖ 리뷰 요청 해제됨: $(mention_discord_user "$REMOVED_REVIEWER")"
            else
              TEXT="➖ 리뷰 요청이 해제되었습니다."
            fi
          elif [ "$ACTION" = "synchronize" ]; then
            COMMITS_URL=$(jq -r '.pull_request.commits_url' "$GITHUB_EVENT_PATH")
            COMMITS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$COMMITS_URL")
            LAST_COMMIT_MSG=$(echo "$COMMITS" | jq -r 'if type=="array" and length>0 then (.[-1].commit.message // "") else "" end' | head -n 1)
            COMMIT_COUNT=$(echo "$COMMITS" | jq 'if type=="array" then length else 0 end')
            if [ -n "$LAST_COMMIT_MSG" ] && [ "$LAST_COMMIT_MSG" != "null" ]; then
              TEXT=$(printf '🔄 새 커밋 추가됨 (%s commits)\n• %s' "$COMMIT_COUNT" "$LAST_COMMIT_MSG")
            else
              TEXT="🔄 새 커밋이 추가되었습니다."
            fi
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            TEXT="✅ PR #${{ steps.pr.outputs.pr_number }} 머지 완료: $HEAD_REF -> $BASE_REF"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" != "true" ]; then
            TEXT="🗑️ PR #${{ steps.pr.outputs.pr_number }} 이 머지 없이 닫혔습니다: $HEAD_REF -> $BASE_REF"
          else
            echo "No message needed."; exit 0
          fi

          RESP=$(curl -s -X POST "$DISCORD_API/channels/$THREAD_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord thread reply failed"; echo "$RESP"; exit 1
          fi

  alert-direct-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 이 커밋의 PR 조회만 함 = pull-requests read.
    permissions:
      pull-requests: read
    env:
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_PR_CHANNEL_ID }}
      DISCORD_API: https://discord.com/api/v10
    steps:
      - name: Check if direct push (not a PR merge)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 이 push 커밋과 연결된 PR 을 직접 조회한다. closed PR 20건 윈도우 스캔은 머지 직후 다른 PR 업데이트에 밀려
          # 대상 PR 을 놓쳐 정상 머지를 "직접 푸시"로 오분류(@here 오탐)할 수 있다. commits/{sha}/pulls 는 그 커밋의 PR 을 바로 준다.
          PR_LIST=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")
          PR_COUNT=$(echo "$PR_LIST" | jq 'if type=="array" then length else 0 end')
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send Discord alert
        if: steps.check.outputs.pr_count == '0'
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          PUSHER="${{ github.actor }}"
          DISCORD_ID=$(echo "$DISCORD_USER_MAP" | jq -r --arg login "$PUSHER" '.[$login] // empty')
          if [ -n "$DISCORD_ID" ]; then PUSHER_MENTION="<@$DISCORD_ID>"; else PUSHER_MENTION="$PUSHER"; fi

          COMMIT_MSG=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | head -n 1)
          SHORT_SHA="${{ github.sha }}"; SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          SOUNDS=("비상비상 애옹애옹 🐱" "비상비상 멍멍멍멍 🐶" "비상비상 크르르릉~~~!!! 🐯" "비상비상 꽥꽥꽥꽥 🦆" "비상비상 어흥어흥!!! 🦁" "비상비상 뀨뀨뀨뀨 🐹" "비상비상 히이이잉~~~ 🐴" "비상비상 총총총총 🐰")
          SOUND="${SOUNDS[$RANDOM % ${#SOUNDS[@]}]}"

          # Slack <!channel> → Discord @here. allowed_mentions 에 everyone(= @here/@everyone)·users 를 열어야 실제로 핑이 간다.
          TEXT=$(printf '@here 🚨🚨🚨 %s 님이 main에 **직접 푸시** 했어요!!\n%s\n\n• **커밋**: [%s](%s)\n• **메시지**: %s' \
            "$PUSHER_MENTION" "$SOUND" "$SHORT_SHA" "$COMMIT_URL" "$COMMIT_MSG")

          RESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["everyone","users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord post failed: $RESP"; exit 1
          fi
