name: Discord PR Bot

on:
  # 기존 PR 스레드를 현재 정책으로 일괄 통일(팀원 추가·닫힘 상태)하는 수동 실행용. Actions → Run workflow.
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - ready_for_review
      - review_requested
      - review_request_removed
      - edited
      - synchronize
      - closed
  push:
    branches:
      - main

# 최소권한: 상단은 비우고 job 단위로만 필요한 것을 준다 (zizmor excessive-permissions).
permissions: {}

# 레이스 방지용 concurrency
concurrency:
  group: discord-pr-bot-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  notify-discord:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # metadata 코멘트는 PR(=issue #N)에 다는데, 대상이 PR 이라 생성엔 pull-requests write 가 필요하다
    # (issues:write 만으론 403 Resource not accessible). 연관 이슈(close #N) 상태 조회는 issues:read.
    permissions:
      pull-requests: write
      issues: read
    env:
      # github 로그인 → discord user id 매핑(멘션용). 알림(deploy/promote)과 같은 secret 을 공유한다.
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      # 봇 토큰 — webhook 과 달리 스레드 생성/메시지 수정이 필요해 봇 토큰을 쓴다.
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_PR_CHANNEL_ID }}
      DISCORD_API: https://discord.com/api/v10

    steps:
      - name: Extract PR data
        id: pr
        shell: bash
        env:
          # 사용자 제어 값(제목·브랜치명 등)은 run 에 ${{ }} 로 직접 보간하지 않고 env 로 받는다 — 제목의 백틱·$()·따옴표가
          # 스크립트로 실행/크래시되는 인젝션을 막는다. env 값은 셸이 재파싱하지 않아 안전하다.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 멘션 맵 방어 — 미설정이면 빈 객체. `${VAR:-{}}` 는 값이 있을 때 bash 가 stray `}` 를 붙여 jq 를 깨뜨리므로 분리한다.
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "pr_title<<__PR_TITLE_EOF__"
            echo "$PR_TITLE"
            echo "__PR_TITLE_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          # 작성자 멘션: 매핑 있으면 <@discordid>, 없으면 로그인명(핑 안 감).
          AUTHOR_DISCORD_ID=$(echo "$DISCORD_USER_MAP" | jq -r --arg login "$AUTHOR_LOGIN" '.[$login] // empty')
          if [ -n "$AUTHOR_DISCORD_ID" ]; then
            AUTHOR_MENTION="<@$AUTHOR_DISCORD_ID>"
          else
            AUTHOR_MENTION="$AUTHOR_LOGIN"
          fi

          echo "author=$AUTHOR_MENTION" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Prepare shared helpers
        # post_parent·update 에 복붙돼 있던 헬퍼 4개를 공유 스크립트로 추출한다(#661 nitpick). checkout 없이
        # 같은 job 의 러너 파일시스템($RUNNER_TEMP)으로 공유하고, 함수가 참조하는 REPO·DISCORD_USER_MAP 은
        # GITHUB_ENV 로 이후 스텝에 넘긴다(GH_TOKEN 은 각 스텝이 secrets 로 받는다).
        env:
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'
          cat > "$RUNNER_TEMP/discord-pr-lib.sh" <<'LIB'
          # github 로그인 → discord 멘션(매핑 없으면 @로그인명, 핑 안 감). $DISCORD_USER_MAP 참조.
          mention_discord_user() {
            local github_id="$1" discord_id
            discord_id=$(echo "$DISCORD_USER_MAP" | jq -r --arg id "$github_id" '.[$id] // empty')
            if [ -n "$discord_id" ]; then echo "<@$discord_id>"; else echo "@$github_id"; fi
          }

          # requested_reviewers → "a, b" 멘션 목록(없으면 "없음"). $GITHUB_EVENT_PATH 참조.
          build_reviewer_text() {
            local reviewers reviewer_text user_mention
            reviewers=$(jq -r '.pull_request.requested_reviewers[]?.login' "$GITHUB_EVENT_PATH")
            reviewer_text=""
            if [ -z "$reviewers" ]; then echo "없음"; return; fi
            while IFS= read -r reviewer; do
              [ -z "$reviewer" ] && continue
              user_mention=$(mention_discord_user "$reviewer")
              if [ -z "$reviewer_text" ]; then reviewer_text="$user_mention"; else reviewer_text="$reviewer_text, $user_mention"; fi
            done <<< "$reviewers"
            [ -z "$reviewer_text" ] && reviewer_text="없음"
            echo "$reviewer_text"
          }

          # PR 라벨을 "a, b" 목록으로(없으면 "없음"). $GITHUB_EVENT_PATH 참조.
          build_label_text() {
            local labels
            labels=$(jq -r '[.pull_request.labels[]?.name] | join(", ")' "$GITHUB_EVENT_PATH")
            [ -z "$labels" ] && echo "없음" || echo "$labels"
          }

          # PR 본문의 close #N 을 뽑아 각 이슈 상태(🟢열림/⚫닫힘)와 링크 목록으로. $GH_TOKEN·$REPO 참조.
          build_issue_text() {
            local pr_body="$1" issues issue_text num res state emoji link line
            issues=$(echo "$pr_body" | grep -oiE '\bclose[sd]?[[:space:]]+#[0-9]+' | grep -oE '#[0-9]+' | sort -u || true)
            issue_text=""
            if [ -z "$issues" ]; then echo "없음"; return; fi
            while IFS= read -r issue; do
              [ -z "$issue" ] && continue
              num=$(echo "$issue" | tr -d '#')
              res=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/issues/$num")
              state=$(echo "$res" | jq -r '.state // "unknown"')
              if [ "$state" = "open" ]; then emoji="🟢"; elif [ "$state" = "closed" ]; then emoji="⚫"; else emoji="❓"; fi
              link="https://github.com/$REPO/issues/$num"
              # URL 을 <> 로 감싸 Discord 임베드 카드를 억제한다(클릭은 유지). 이슈 카드가 커서 부모 카드 본문을
              # 밀어내므로, 연관 이슈는 링크만 남기고 카드는 PR(부모 타이틀 링크)만 뜨게 한다.
              line="$emoji [#$num](<$link>)"
              if [ -z "$issue_text" ]; then issue_text="$line"; else issue_text=$(printf "%s\n%s" "$issue_text" "$line"); fi
            done <<< "$issues"
            [ -z "$issue_text" ] && issue_text="없음"
            echo "$issue_text"
          }

          # PR 본문의 ## Task 섹션 불릿을 "• ..." 요약으로(없으면 "요약 없음"). 순수(인자만).
          build_summary() {
            local pr_body="$1"
            printf '%s\n' "$pr_body" | awk '
              BEGIN { in_task=0; n=0; out="" }
              /^##/ {
                if (in_task == 1) exit
                r = $0
                sub(/^##[[:space:]]+/, "", r)
                ok = (match(r, /^[Tt][Aa][Ss][Kk]([^A-Za-z]|$)/) || match(r, /[[:space:]][Tt][Aa][Ss][Kk]([^A-Za-z]|$)/))
                if (ok) { in_task=1; next }
                next
              }
              in_task == 1 && /^##/ { exit }
              in_task == 1 {
                s = $0
                sub(/^[[:space:]]+/, "", s)
                if (s ~ /^>/) next
                if (s ~ /^-[[:space:]]*\[[[:space:]xX]\]/) next
                if (s ~ /^-[[:space:]]+/) {
                  sub(/^-[[:space:]]+/, "", s)
                  if (length(s) > 0) { if (n++ > 0) out = out "\n"; out = out "• " s }
                }
              }
              END { if (n > 0) print out; else print "요약 없음" }
            '
          }
          LIB
          {
            echo "DISCORD_USER_MAP<<__PKENV_EOF__"
            echo "$DISCORD_USER_MAP"
            echo "__PKENV_EOF__"
            echo "REPO=$REPO"
          } >> "$GITHUB_ENV"

      - name: Find existing Discord message/thread from PR comments
        id: find_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          COMMENTS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.pr.outputs.pr_number }}/comments")

          # 메타 주석 본문(마지막 것)에서 JSON 객체를 뽑는다. select 는 `discord-pr-bot: {`(JSON 시작) 마커까지 요구한다.
          # 느슨한 contains("discord-pr-bot") 는 discord-pr-bot.yml 파일명을 언급한 CodeRabbit·사람 리뷰 코멘트까지 잡아,
          # tail -n 1 이 그 코멘트를 집으면 JSON 이 없어 metadata 를 못 읽고 이후 스텝이 전부 skip 되던 버그가 있었다.
          # initial_reviewers 는 배열([])이라 중괄호 중첩이 없어 `\{[^}]*\}` 로 객체 하나를 통째로 잡을 수 있다.
          BODY=$(echo "$COMMENTS" | jq -r '.[]? | objects | select((.body // "") | test("discord-pr-bot:\\s*\\{")) | .body' | tail -n 1)
          # 신규 PR 은 아직 메타 주석이 없어 grep 이 no-match(exit 1)로 끝난다. set -eo pipefail 이 이를 실패로 보고 스텝을
          # 죽이므로 `|| true` 로 방어한다. 없으면 META_JSON 은 빈 문자열이고, 빈 입력에 jq 를 물리면 파싱 에러가 나므로
          # META_JSON 이 있을 때만 파싱한다.
          META_JSON=$(echo "$BODY" | grep -oP 'discord-pr-bot:\s*\K\{[^}]*\}' | tail -n 1 || true)

          MESSAGE_ID=""; THREAD_ID=""; CHANNEL_ID=""; INITIAL_REVIEWERS="[]"
          if [ -n "$META_JSON" ]; then
            MESSAGE_ID=$(echo "$META_JSON" | jq -r '.message_id // empty')
            THREAD_ID=$(echo "$META_JSON" | jq -r '.thread_id // empty')
            CHANNEL_ID=$(echo "$META_JSON" | jq -r '.channel_id // empty')
            INITIAL_REVIEWERS=$(echo "$META_JSON" | jq -c '.initial_reviewers // []')
          fi

          echo "message_id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
          echo "thread_id=$THREAD_ID" >> "$GITHUB_OUTPUT"
          echo "channel_id=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "initial_reviewers=$INITIAL_REVIEWERS" >> "$GITHUB_OUTPUT"

      - name: Post parent message and create thread
        if: steps.find_meta.outputs.message_id == '' && (github.event.action == 'opened' || github.event.action == 'ready_for_review') && github.event.pull_request.draft == false
        id: post_parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        shell: bash
        run: |
          source "$RUNNER_TEMP/discord-pr-lib.sh"

          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          REVIEWER_TEXT=$(build_reviewer_text)
          LABEL_TEXT=$(build_label_text)
          ISSUE_TEXT=$(build_issue_text "$PR_BODY")
          SUMMARY=$(build_summary "$PR_BODY")

          TITLE_LINK="[#${{ steps.pr.outputs.pr_number }} $PR_TITLE](${{ steps.pr.outputs.pr_url }})"

          TEXT=$(cat <<EOF
          [PR] $TITLE_LINK


          🔥 연관 이슈
          $ISSUE_TEXT


          📝 작업 요약
          $SUMMARY


          **Author**: ${{ steps.pr.outputs.author }}
          **branch**: $HEAD_REF -> $BASE_REF
          **reviewer**: $REVIEWER_TEXT
          **label**: $LABEL_TEXT
          EOF
          )
          # Discord content 2000자 제한 — 넘치면 POST 가 400 → 실패. 여유 두고 1900자로 자른다 (러너 UTF-8 로케일 char 기준).
          TEXT="${TEXT:0:1900}"

          # 1) 부모 메시지 발행 → message id 확보
          RESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["users"]}}')")
          MESSAGE_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$MESSAGE_ID" ]; then
            echo "Discord parent post failed"; echo "$RESP"; exit 1
          fi

          # 2) 그 메시지에서 스레드 생성(봇 필요). 이름은 100자 제한이라 잘라 넣는다.
          THREAD_NAME=$(printf 'PR #%s %s' "${{ steps.pr.outputs.pr_number }}" "$PR_TITLE" | cut -c1-90)
          TRESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages/$MESSAGE_ID/threads" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg name "$THREAD_NAME" '{name:$name, auto_archive_duration:10080}')")
          THREAD_ID=$(echo "$TRESP" | jq -r '.id // empty')
          if [ -z "$THREAD_ID" ]; then
            echo "Discord thread create failed"; echo "$TRESP"; exit 1
          fi

          # 팀 전원을 스레드 멤버로 추가 — 공개 스레드는 멤버만 사이드바에 뜨므로, DISCORD_USER_MAP 의 모든
          # discord id 를 넣어 팀 전원 사이드바에 노출한다(멘션과 달리 조용히 목록에만 올림). 실패해도 무해.
          echo "$DISCORD_USER_MAP" | jq -r '.[]?' | while read -r uid; do
            [ -z "$uid" ] && continue
            curl -s -o /dev/null -X PUT "$DISCORD_API/channels/$THREAD_ID/thread-members/$uid" \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN"
          done

          echo "message_id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
          echo "thread_id=$THREAD_ID" >> "$GITHUB_OUTPUT"

      - name: Save Discord metadata into PR comment
        if: steps.post_parent.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          INITIAL_REVIEWERS=$(jq -c '[.pull_request.requested_reviewers[]?.login]' "$GITHUB_EVENT_PATH")
          META="<!-- discord-pr-bot: {\"channel_id\":\"$DISCORD_CHANNEL_ID\",\"message_id\":\"${{ steps.post_parent.outputs.message_id }}\",\"thread_id\":\"${{ steps.post_parent.outputs.thread_id }}\",\"initial_reviewers\":$INITIAL_REVIEWERS} -->"
          # visible 안내문 + 숨겨진 metadata 주석. find_meta 가 `discord-pr-bot: {` 마커로 이 주석을 잡으므로 연동에 영향 없다.
          BODY=$(printf '%s\n%s' 'Discord 스레드 연동용 메타데이터입니다. discord-pr-bot 워크플로가 자동 생성하며, 수정·삭제하면 PR 과 Discord 알림 연동이 끊깁니다.' "$META")

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.pr.outputs.pr_number }}/comments" \
            -d "$(jq -n --arg body "$BODY" '{body:$body}')"

      - name: Update parent Discord message
        if: github.event.action != 'opened' && steps.find_meta.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        shell: bash
        run: |
          source "$RUNNER_TEMP/discord-pr-lib.sh"

          CHANNEL_ID="${{ steps.find_meta.outputs.channel_id }}"
          MESSAGE_ID="${{ steps.find_meta.outputs.message_id }}"
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          REVIEWER_TEXT=$(build_reviewer_text)
          LABEL_TEXT=$(build_label_text)
          ISSUE_TEXT=$(build_issue_text "$PR_BODY")
          SUMMARY=$(build_summary "$PR_BODY")
          STATUS_LINE=""
          if [ "${{ github.event.action }}" = "closed" ] && [ "${{ steps.pr.outputs.merged }}" = "true" ]; then
            STATUS_LINE="✅ 머지 완료"
          elif [ "${{ github.event.action }}" = "closed" ] && [ "${{ steps.pr.outputs.merged }}" != "true" ]; then
            STATUS_LINE="🗑️ 머지 없이 종료됨"
          fi
          TITLE_LINK="[#${{ steps.pr.outputs.pr_number }} $PR_TITLE](${{ steps.pr.outputs.pr_url }})"

          TEXT=$(cat <<EOF
          [PR] $TITLE_LINK
          $STATUS_LINE

          🔥 **연관 이슈**
          $ISSUE_TEXT


          📝 **작업 요약**
          $SUMMARY


          **Author**: ${{ steps.pr.outputs.author }}
          **Branch**: $HEAD_REF -> $BASE_REF
          **Reviewer**: $REVIEWER_TEXT
          **Label**: $LABEL_TEXT
          EOF
          )
          TEXT="${TEXT:0:1900}"

          RESP=$(curl -s -X PATCH "$DISCORD_API/channels/$CHANNEL_ID/messages/$MESSAGE_ID" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord update failed"; echo "$RESP"; exit 1
          fi

      - name: Reply to thread
        if: github.event.action != 'opened' && steps.find_meta.outputs.thread_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        shell: bash
        run: |
          source "$RUNNER_TEMP/discord-pr-lib.sh"

          THREAD_ID="${{ steps.find_meta.outputs.thread_id }}"
          ACTION="${{ steps.pr.outputs.action }}"
          MERGED="${{ steps.pr.outputs.merged }}"

          TEXT=""

          if [ "$ACTION" = "review_requested" ]; then
            REQUESTED_REVIEWER=$(jq -r '.requested_reviewer.login // ""' "$GITHUB_EVENT_PATH")
            INITIAL_REVIEWERS='${{ steps.find_meta.outputs.initial_reviewers }}'
            [ -z "$INITIAL_REVIEWERS" ] && INITIAL_REVIEWERS="[]"
            # PR open 시점에 이미 걸려 있던 리뷰어면 스레드 답글을 건너뛴다(중복 방지).
            IS_INITIAL=$(echo "$INITIAL_REVIEWERS" | jq -r --arg r "$REQUESTED_REVIEWER" 'map(. == $r) | any')
            if [ "$IS_INITIAL" = "true" ]; then
              echo "Reviewer $REQUESTED_REVIEWER was present at PR open, skipping thread reply."; exit 0
            fi
            if [ -n "$REQUESTED_REVIEWER" ]; then
              TEXT="🙋 리뷰 요청됨: $(mention_discord_user "$REQUESTED_REVIEWER")"
            else
              TEXT="🙋 리뷰 요청됨"
            fi
          elif [ "$ACTION" = "review_request_removed" ]; then
            REMOVED_REVIEWER=$(jq -r '.requested_reviewer.login // ""' "$GITHUB_EVENT_PATH")
            if [ -n "$REMOVED_REVIEWER" ]; then
              TEXT="➖ 리뷰 요청 해제됨: $(mention_discord_user "$REMOVED_REVIEWER")"
            else
              TEXT="➖ 리뷰 요청이 해제되었습니다."
            fi
          elif [ "$ACTION" = "synchronize" ]; then
            # 커밋 수는 PR 페이로드가 직접 주는 정확한 총수(.pull_request.commits)를 쓴다. commits_url 을 fetch 해
            # length 로 세면 페이지네이션 상한(기본 30)에 잘려 커밋 30개 넘는 PR 이 "30 commits"로 오표기된다.
            COMMIT_COUNT=$(jq -r '.pull_request.commits' "$GITHUB_EVENT_PATH")
            # 마지막 커밋 메시지는 head sha 단건 조회로 정확히 가져온다(commits_url 첫 페이지의 마지막이 아니라 실제 최신).
            HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
            LAST_COMMIT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$HEAD_SHA")
            LAST_COMMIT_MSG=$(echo "$LAST_COMMIT" | jq -r '.commit.message // ""' | head -n 1)
            if [ -n "$LAST_COMMIT_MSG" ] && [ "$LAST_COMMIT_MSG" != "null" ]; then
              TEXT=$(printf '🔄 새 커밋 추가됨 (%s commits)\n• %s' "$COMMIT_COUNT" "$LAST_COMMIT_MSG")
            else
              TEXT="🔄 새 커밋이 추가되었습니다."
            fi
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            TEXT="✅ PR #${{ steps.pr.outputs.pr_number }} 머지 완료: $HEAD_REF -> $BASE_REF"
          elif [ "$ACTION" = "closed" ] && [ "$MERGED" != "true" ]; then
            TEXT="🗑️ PR #${{ steps.pr.outputs.pr_number }} 이 머지 없이 닫혔습니다: $HEAD_REF -> $BASE_REF"
          else
            echo "No message needed."; exit 0
          fi

          RESP=$(curl -s -X POST "$DISCORD_API/channels/$THREAD_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord thread reply failed"; echo "$RESP"; exit 1
          fi

      - name: Manage status reaction (전환 - 현재 상태 하나만)
        # 부모 메시지가 있어야(신규는 post_parent, 기존은 find_meta) 리액션을 단다. review_requested 등
        # 상태 전환이 없는 이벤트는 아래 case 에서 스킵한다(리액션은 큰 상태만, 세부는 스레드 답글).
        if: steps.find_meta.outputs.message_id != '' || steps.post_parent.outputs.message_id != ''
        env:
          ACTION: ${{ steps.pr.outputs.action }}
          MERGED: ${{ steps.pr.outputs.merged }}
        shell: bash
        run: |
          MSG_ID="${{ steps.find_meta.outputs.message_id }}"
          [ -z "$MSG_ID" ] && MSG_ID="${{ steps.post_parent.outputs.message_id }}"
          CH_ID="${{ steps.find_meta.outputs.channel_id }}"
          [ -z "$CH_ID" ] && CH_ID="$DISCORD_CHANNEL_ID"
          [ -z "$MSG_ID" ] && { echo "부모 메시지 없음 - 리액션 생략"; exit 0; }

          # PiKi 상태 이모지 (name:id). 전환 방식이라 매 이벤트에 이전 상태를 지우고 현재 하나만 남긴다.
          EMOJI_OPEN="piki_open:1523200235701014528"
          EMOJI_WIP="piki_wip:1523200286758539264"
          EMOJI_DONE="piki_done:1523200333482823720"
          EMOJI_CLOSED="piki_closed:1523200373899132928"
          ALL="$EMOJI_OPEN $EMOJI_WIP $EMOJI_DONE $EMOJI_CLOSED"

          reaction_api() {
            # $1: HTTP 메서드, $2: name:id 이모지. 봇 자신의 리액션(@me)만 조작한다.
            # Discord reaction API 는 rate limit 이 빡빡해(이전 상태 DELETE 3 + 현재 PUT 1 을 몰아 호출하면 429),
            # 429 면 응답 body 의 retry_after(초, 소수 가능)만큼 쉬고 재시도한다(최대 5회). 소진 시 마지막 코드를 돌려준다.
            local method="$1" emoji="$2" url resp code retry
            url="$DISCORD_API/channels/$CH_ID/messages/$MSG_ID/reactions/$emoji/@me"
            for _ in 1 2 3 4 5; do
              resp=$(curl -s -w '\n%{http_code}' -X "$method" "$url" -H "Authorization: Bot $DISCORD_BOT_TOKEN")
              code=$(printf '%s' "$resp" | tail -n1)
              [ "$code" != "429" ] && { printf '%s' "$code"; return; }
              # 429 body: {"message":..,"retry_after":0.5,..}. 없거나 비정상이면 1 초.
              retry=$(printf '%s' "$resp" | sed '$d' | jq -r '.retry_after // 1' 2>/dev/null)
              case "$retry" in ''|*[!0-9.]*) retry=1 ;; esac
              sleep "$retry"
            done
            printf '%s' "$code"
          }

          # 이번 이벤트의 현재 상태. 전환 없는 이벤트(review_requested 등)는 상태를 안 바꾸고 끝낸다.
          CURRENT=""
          case "$ACTION" in
            opened|ready_for_review) CURRENT="$EMOJI_OPEN" ;;
            synchronize)             CURRENT="$EMOJI_WIP" ;;
            closed)
              if [ "$MERGED" = "true" ]; then CURRENT="$EMOJI_DONE"; else CURRENT="$EMOJI_CLOSED"; fi ;;
            *) echo "상태 전환 없는 이벤트($ACTION) - 리액션 유지"; exit 0 ;;
          esac

          # 이전 상태 제거(없으면 Discord 가 무시) 후 현재 하나만 추가.
          for e in $ALL; do
            [ "$e" = "$CURRENT" ] && continue
            reaction_api DELETE "$e" >/dev/null
          done
          CODE=$(reaction_api PUT "$CURRENT")
          # 성공은 204. 실패해도 알림 본체는 이미 나갔으므로 워크플로를 깨지 않고 로그만 남긴다.
          [ "$CODE" = "204" ] && echo "리액션 설정: $CURRENT" || echo "::warning::리액션 실패 (HTTP $CODE): $CURRENT"

      - name: Pin parent on open (열린 PR 채널 상단 고정)
        # 열린(리뷰 대기) PR 부모를 채널 상단에 고정해 눈에 띄게 한다. 고정은 채널당 50개 한도라, 초과 시
        # PUT 이 실패해도(경고만) 알림 본체엔 영향을 주지 않는다. 닫힐 때 아래 스텝이 해제한다.
        if: (github.event.action == 'opened' || github.event.action == 'ready_for_review') && steps.post_parent.outputs.message_id != ''
        shell: bash
        run: |
          MSG_ID="${{ steps.post_parent.outputs.message_id }}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/pins/$MSG_ID" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN")
          [ "$CODE" = "204" ] && echo "고정됨" || echo "::warning::고정 실패 (HTTP $CODE) - 채널 고정 50개 한도일 수 있음"

      - name: Unpin and archive thread on close (종료 시 정리)
        # 머지/종료 시: 부모 고정 해제 + 스레드 이름에 결과 프리픽스(✅/🗑️) + archive·lock 으로 정리한다.
        if: github.event.action == 'closed' && steps.find_meta.outputs.message_id != ''
        env:
          MERGED: ${{ steps.pr.outputs.merged }}
          PR_TITLE: ${{ steps.pr.outputs.pr_title }}
        shell: bash
        run: |
          CH_ID="${{ steps.find_meta.outputs.channel_id }}"
          [ -z "$CH_ID" ] && CH_ID="$DISCORD_CHANNEL_ID"
          MSG_ID="${{ steps.find_meta.outputs.message_id }}"
          THREAD_ID="${{ steps.find_meta.outputs.thread_id }}"

          # 고정 해제 (열린 PR 만 상단에 두므로, 닫히면 내린다). 없어도 무해.
          if [ -n "$MSG_ID" ]; then
            curl -s -o /dev/null -X DELETE "$DISCORD_API/channels/$CH_ID/pins/$MSG_ID" \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN"
          fi

          # 스레드: 이름 앞에 결과 프리픽스 + archive(닫힘). lock 은 하지 않아 머지 후에도 글을 쓸 수 있게 둔다.
          # (archived 만이라 글을 쓰면 다시 열린다.) 이름은 100자 제한이라 90자로 자른다.
          if [ -n "$THREAD_ID" ]; then
            if [ "$MERGED" = "true" ]; then PREFIX="✅"; else PREFIX="🗑️"; fi
            NEW_NAME=$(printf '%s PR #%s %s' "$PREFIX" "${{ steps.pr.outputs.pr_number }}" "$PR_TITLE" | cut -c1-90)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              "$DISCORD_API/channels/$THREAD_ID" \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$(jq -n --arg name "$NEW_NAME" '{name:$name, archived:true, locked:false}')")
            [ "$CODE" = "200" ] && echo "스레드 정리됨: $NEW_NAME" || echo "::warning::스레드 정리 실패 (HTTP $CODE)"
          fi

  alert-direct-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 이 커밋의 PR 조회만 함 = pull-requests read.
    permissions:
      pull-requests: read
    env:
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_PR_CHANNEL_ID }}
      DISCORD_API: https://discord.com/api/v10
    steps:
      - name: Check if direct push (not a PR merge)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 이 push 커밋과 연결된 PR 을 직접 조회한다. closed PR 20건 윈도우 스캔은 머지 직후 다른 PR 업데이트에 밀려
          # 대상 PR 을 놓쳐 정상 머지를 "직접 푸시"로 오분류(@here 오탐)할 수 있다. commits/{sha}/pulls 는 그 커밋의 PR 을 바로 준다.
          # 조회 실패(401/403/rate limit 등)를 pr_count=0 으로 흘리면 정상 머지를 직접푸시로 오인해 @here 를 쏜다.
          # HTTP 200 이 아니면 알림을 생략(fail-safe)한다 — pr_count=skip 은 아래 알림 스텝의 '== 0' 조건에 안 걸린다.
          HTTP_CODE=$(curl -s -o /tmp/pr_list.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls") || HTTP_CODE="000"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "commits/{sha}/pulls 조회 실패 (HTTP $HTTP_CODE) — 직접푸시 오탐 방지 위해 알림 생략"
            echo "pr_count=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/pr_list.json)
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - name: Send Discord alert
        if: steps.check.outputs.pr_count == '0'
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'

          PUSHER="${{ github.actor }}"
          DISCORD_ID=$(echo "$DISCORD_USER_MAP" | jq -r --arg login "$PUSHER" '.[$login] // empty')
          if [ -n "$DISCORD_ID" ]; then PUSHER_MENTION="<@$DISCORD_ID>"; else PUSHER_MENTION="$PUSHER"; fi

          COMMIT_MSG=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | head -n 1)
          SHORT_SHA="${{ github.sha }}"; SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          SOUNDS=("비상비상 애옹애옹 🐱" "비상비상 멍멍멍멍 🐶" "비상비상 크르르릉~~~!!! 🐯" "비상비상 꽥꽥꽥꽥 🦆" "비상비상 어흥어흥!!! 🦁" "비상비상 뀨뀨뀨뀨 🐹" "비상비상 히이이잉~~~ 🐴" "비상비상 총총총총 🐰")
          SOUND="${SOUNDS[$RANDOM % ${#SOUNDS[@]}]}"

          # @here(=@everyone) 핑은 allowed_mentions 에 everyone·users 를 열어야 실제로 간다.
          TEXT=$(printf '@here 🚨🚨🚨 %s 님이 main에 **직접 푸시** 했어요!!\n%s\n\n• **커밋**: [%s](%s)\n• **메시지**: %s' \
            "$PUSHER_MENTION" "$SOUND" "$SHORT_SHA" "$COMMIT_URL" "$COMMIT_MSG")

          RESP=$(curl -s -X POST "$DISCORD_API/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg content "$TEXT" '{content:$content, allowed_mentions:{parse:["everyone","users"]}}')")
          OK=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$OK" ]; then
            echo "Discord post failed: $RESP"; exit 1
          fi

  backfill-threads:
    # 기존 PR 스레드를 현재 정책으로 일괄 통일하는 수동 백필. Actions → Run workflow.
    #  - 열린 PR:        unarchive + 팀원(DISCORD_USER_MAP) 전원 스레드 멤버 추가(사이드바 노출)
    #  - 머지된 PR:      이름에 ✅ 프리픽스 + archived(닫힘). lock 은 안 함(글 쓰기 가능)
    #  - 머지 없이 닫힘: 이름에 🗑️ 프리픽스 + archived
    # 과거 find_meta 버그(#674 이전)로 close 정리가 스킵돼 안 닫힌 스레드까지 소급 정리한다. 멱등(재실행 안전).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
      DISCORD_API: https://discord.com/api/v10
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Backfill existing PR threads (members + close state)
        shell: bash
        run: |
          [ -n "$DISCORD_USER_MAP" ] || DISCORD_USER_MAP='{}'
          # 최근 100개 PR(열림+닫힘). 스레드 메타가 있는 PR 만 처리한다.
          PRS=$(gh api "repos/$REPO/pulls?state=all&per_page=100&sort=updated&direction=desc")
          echo "$PRS" | jq -c '.[] | {num:.number, title:.title, state:.state, merged:(.merged_at != null)}' | while read -r pr; do
            NUM=$(echo "$pr" | jq -r '.num')
            TITLE=$(echo "$pr" | jq -r '.title')
            STATE=$(echo "$pr" | jq -r '.state')
            MERGED=$(echo "$pr" | jq -r '.merged')
            # 메타 주석에서 thread_id (find_meta 와 같은 JSON 마커 매칭)
            COMMENTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$NUM/comments")
            META=$(echo "$COMMENTS" | jq -r '.[]? | objects | select((.body // "") | test("discord-pr-bot:\\s*\\{")) | .body' | tail -n 1)
            THREAD_ID=$(echo "$META" | grep -oP 'discord-pr-bot:\s*\K\{[^}]*\}' | jq -r '.thread_id // empty' 2>/dev/null || true)
            if [ -z "$THREAD_ID" ]; then echo "PR #$NUM: 스레드 메타 없음, skip"; continue; fi
            if [ "$STATE" = "open" ]; then
              # 열린 PR: 열림 유지 + 팀원 전원 추가
              curl -s -o /dev/null -X PATCH "$DISCORD_API/channels/$THREAD_ID" \
                -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
                --data '{"archived":false}'
              echo "$DISCORD_USER_MAP" | jq -r '.[]?' | while read -r uid; do
                [ -z "$uid" ] && continue
                curl -s -o /dev/null -X PUT "$DISCORD_API/channels/$THREAD_ID/thread-members/$uid" \
                  -H "Authorization: Bot $DISCORD_BOT_TOKEN"
              done
              echo "PR #$NUM (open): 팀원 추가 + 열림"
            else
              # 닫힘: 결과 프리픽스 + archived(닫힘), lock 안 함
              if [ "$MERGED" = "true" ]; then PREFIX="✅"; else PREFIX="🗑️"; fi
              NEW_NAME=$(printf '%s PR #%s %s' "$PREFIX" "$NUM" "$TITLE" | cut -c1-90)
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH "$DISCORD_API/channels/$THREAD_ID" \
                -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
                --data "$(jq -n --arg name "$NEW_NAME" '{name:$name, archived:true, locked:false}')")
              echo "PR #$NUM ($PREFIX 닫힘): HTTP $CODE"
            fi
          done
