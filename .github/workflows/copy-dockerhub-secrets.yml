# 일회용: core 의 DOCKERHUB_USERNAME/TOKEN 을 extractor·renderer repo secrets 로 복사한다.
# GitHub secrets 는 쓰기 전용이라 밖에서는 값을 못 읽지만, 워크플로 러너 안에서는 env 로 살아 있다 -
# 그 안에서 PROJECT_TOKEN(PAT) 권한으로 대상 repo 에 재등록한다 (migrate-secrets-to-ssm 과 같은 패턴).
# dev 에 머지하지 않는다 - 이 브랜치에서 직접 dispatch 하고, 완료 후 브랜치째 삭제한다.
# 값은 stdin 파이프로만 흐르고 로그에 출력하지 않는다.
name: Copy DockerHub secrets (one-off)

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Copy to extractor and renderer
        run: |
          set -euo pipefail
          # 빈 값 가드 - 소스 secret 미존재가 "빈 값 등록 성공" 으로 위장되는 사고를 막는다.
          [ -n "$DH_USER" ]  || { echo "::error::DOCKERHUB_USERNAME 이 비어 있다"; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::DOCKERHUB_TOKEN 이 비어 있다"; exit 1; }
          for R in TeamPiKi/extractor TeamPiKi/renderer; do
            printf '%s' "$DH_USER"  | gh secret set DOCKERHUB_USERNAME -R "$R"
            printf '%s' "$DH_TOKEN" | gh secret set DOCKERHUB_TOKEN -R "$R"
            echo "copied 2 secrets -> $R"
          done
