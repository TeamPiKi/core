# =============================================================================
# 일회성 마이그레이션 — 앱 런타임 시크릿을 GitHub Environment secrets 에서
# AWS SSM Parameter Store(/piki-core/<env>/<kebab-key>, SecureString)로 심는다.
#
# 배경(등급 C 배포 공통화): 앱 컨테이너 런타임 env 로 들어가는 시크릿을 SSM 으로 단일화한다.
# deploy.yml 의 앱 기동부(브랜치 infra/deploy-secrets-from-ssm)가 이 경로에서 값을 pull 한다.
# 여기서 심는 대상은 "앱 컨테이너 -e 로 주입되던 secrets.X" 만이다. 배포 자체의 자격증명
# (DOCKERHUB_*, EC2_*), 프로비저닝용(GRAFANA_*, provision 이 쓰는 DB_*), 계산·조건값
# (SENTRY_DSN 의 조건 게이트, IMAGE_TAG 등)은 대상이 아니라 GH 에 남는다.
#
# 사용법: Actions → 이 워크플로 → Run workflow → environment(dev/staging/prod) 선택 → 3회 실행.
#   job 이 environment: <입력> 을 걸어 그 환경의 GH secrets 를 읽고, 그 환경 경로에 심는다.
#
# 폐기(일회성): 3환경 심기 + deploy 전환 검증이 끝나면 (1) 이 파일과 (2) 아래 임시 AWS 키
#   secret 두 개(SSM_MIGRATION_AWS_ACCESS_KEY_ID / SSM_MIGRATION_AWS_SECRET_ACCESS_KEY)와
#   (3) SSM 으로 옮긴 원본 GH secrets 를 제거한다.
#
# 사전 준비(사용자): AWS 콘솔에서 ssm:PutParameter (/piki-core/* 대상) 권한의 임시 IAM 키를
#   만들어 repo secret SSM_MIGRATION_AWS_ACCESS_KEY_ID / SSM_MIGRATION_AWS_SECRET_ACCESS_KEY 로
#   추가한다(리전 ap-northeast-2). 마이그레이션 후 즉시 폐기한다.
#
# 안전장치: 값을 로그에 절대 찍지 않는다(set -x 금지, echo 는 이름·버전·바이트수만). 빈 값은
#   건너뛰고 "skipped(empty)" 로 남긴다(환경별 부재 가능 — 예: dev 브릭가드 secret). SSM standard
#   파라미터 4KB(4096B) 초과분은 조용히 절단하지 않고 어느 키인지 밝히며 즉시 실패시킨다.
#
# 키 매핑(단일 진실): UPPER_SNAKE GH secret 이름 → /piki-core/<env>/<kebab-case> 는
#   기계 변환(tr 'A-Z_' 'a-z-')이며, deploy 전환 브랜치의 역변환(tr 'a-z-' 'A-Z_')과 정확히 짝이다.
#   아래 SECRETS 배열이 이관 대상의 단일 목록이다.
# =============================================================================
name: Migrate secrets to SSM (one-shot)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "심을 대상 환경 (그 환경의 GH secrets 를 읽어 /piki-core/<env>/ 로 심는다)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

# secrets/입력만 사용 — 소스 checkout 불필요. 최소 권한.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 이 환경의 secrets 세트를 읽는다(deploy.yml 과 동일한 GH Environment 분리).
    environment: ${{ inputs.environment }}
    env:
      # 임시 마이그레이션 자격증명(repo secret, 작업 후 폐기). ap-northeast-2.
      AWS_ACCESS_KEY_ID: ${{ secrets.SSM_MIGRATION_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SSM_MIGRATION_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
      # ── 이관 대상 28개(앱 컨테이너 -e 로 주입되던 secrets.X) ──
      # 이름은 아래 SECRETS 배열과 1:1. 여기서 값이 각 환경 secret 으로 바인딩된다.
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI }}
      APPLE_WEB_CALLBACK_URL: ${{ secrets.APPLE_WEB_CALLBACK_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_ADMIN_USER_IDS: ${{ secrets.DISCORD_ADMIN_USER_IDS }}
      DISCORD_ADMIN_CHANNEL_ID: ${{ secrets.DISCORD_ADMIN_CHANNEL_ID }}
      ADMIN_GRANT_SIGNING_KEY: ${{ secrets.ADMIN_GRANT_SIGNING_KEY }}
    steps:
      - name: Put app runtime secrets into SSM (/piki-core/${{ inputs.environment }}/*)
        run: |
          set -euo pipefail
          ENVIRONMENT="${{ inputs.environment }}"

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::임시 AWS 키(SSM_MIGRATION_AWS_ACCESS_KEY_ID / SSM_MIGRATION_AWS_SECRET_ACCESS_KEY)가 비어 있다 — repo secret 추가 후 재실행"
            exit 1
          fi

          # 이관 대상의 단일 목록. deploy 전환 브랜치의 pull 이 /piki-core/<env>/ 아래 이 집합을 되살린다.
          SECRETS=(
            DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD
            JWT_SECRET
            REDIS_HOST REDIS_PORT
            KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_REDIRECT_URI
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI
            APPLE_TEAM_ID APPLE_KEY_ID APPLE_CLIENT_ID APPLE_BUNDLE_ID
            APPLE_PRIVATE_KEY APPLE_REDIRECT_URI APPLE_WEB_CALLBACK_URL
            S3_BUCKET S3_PUBLIC_BASE_URL
            FIREBASE_SERVICE_ACCOUNT
            DISCORD_PUBLIC_KEY DISCORD_ADMIN_USER_IDS DISCORD_ADMIN_CHANNEL_ID
            ADMIN_GRANT_SIGNING_KEY
          )

          # 값을 명령행 argv 로 노출하지 않도록 600 권한 임시 파일로 넘긴다(aws --value file://).
          # file:// 는 파일 내용을 값 그대로 읽어 개행 포함 PEM·큰 JSON 도 바이트 그대로 심는다.
          umask 077
          TMP_VAL="$(mktemp)"
          trap 'rm -f "$TMP_VAL"' EXIT

          PUT=0
          SKIPPED=0
          for NAME in "${SECRETS[@]}"; do
            VALUE="${!NAME-}"
            KEBAB="$(printf '%s' "$NAME" | tr 'A-Z_' 'a-z-')"
            PARAM="/piki-core/$ENVIRONMENT/$KEBAB"
            if [ -z "$VALUE" ]; then
              echo "skipped(empty): $NAME -> $PARAM"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            # SSM standard 파라미터 값 상한 4096B. 초과분은 절단하지 않고 어느 키인지 밝히며 즉시 실패.
            BYTES="$(printf '%s' "$VALUE" | wc -c | tr -d ' ')"
            if [ "$BYTES" -gt 4096 ]; then
              echo "::error::$NAME ($BYTES bytes) > SSM standard 4KB(4096) 상한 — $PARAM 미심기, 중단. (Advanced tier 승격 또는 값 축소 필요)"
              exit 1
            fi
            printf '%s' "$VALUE" > "$TMP_VAL"
            VER="$(aws ssm put-parameter \
              --name "$PARAM" \
              --type SecureString \
              --value "file://$TMP_VAL" \
              --overwrite \
              --query Version --output text)"
            echo "put: $PARAM (version $VER, $BYTES bytes)"
            PUT=$((PUT + 1))
          done

          echo "----------------------------------------------"
          echo "environment=$ENVIRONMENT  put=$PUT  skipped=$SKIPPED  total=${#SECRETS[@]}"
