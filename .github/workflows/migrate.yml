name: Migrate

# AWS 계정 이관 오케스트레이터 (#1092).
#
# 인프라를 "만들고 부수는" 워크플로라 절대 자동 발화하면 안 된다 — workflow_dispatch 만 둔다(push·schedule·workflow_run 없음).
#
# env 축: provision/rehearsal/cutover 는 입력 env(dev|prod) 하나만 대상으로 돈다. "두 번 딸깍" — dev 로 먼저(카나리)
# 돌려 검증하고, 같은 워크플로를 prod 로 한 번 더 실행한다. bootstrap/ssm/infra 는 계정 단위라 env 무관(멱등).
#
# 단계 구현 상태:
#   guard/config/bootstrap/infra = 실동작. ssm = 이식 메커니즘 실동작 + 파라미터 인벤토리는 실행 시점 실측(마커).
#   provision/rehearsal/cutover = 뼈대 실동작 + 런타임 확정 사실(instance-id·DNS API·URL재작성 컬럼·freeze 수단)은
#   각 지점에 "TODO(런타임 확정)" 마커. 이 마커들은 dev 카나리 실행에서 실측해 채운다(#1095~1098).
#
# 자격증명은 절대 workflow_dispatch 입력에 받지 않는다 — 마스킹되지 않아 로그에 평문으로 남는다.
#   bootstrap/ssm/infra: GitHub Environment secret 의 부트스트랩 키(AWS_ACCESS_KEY_ID/SECRET).
#   provision 이후: infra 가 만든 OIDC 역할(AWS_DEPLOY_ROLE_ARN)로 전환.

on:
  workflow_dispatch:
    inputs:
      target_account_id:
        description: "대상 AWS 계정번호 (12자리). 실제 접속 계정과 다르면 guard/bootstrap 가 중단한다."
        required: true
        type: string
      env:
        description: "이관 대상 환경. provision/rehearsal/cutover 가 이 환경만 대상. dev 로 먼저(카나리) → prod."
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: "MIGRATE 를 정확히 입력해야 진행한다(오발 방지)."
        required: true
        type: string
      only:
        description: "all 이면 전체 실행. 특정 단계명을 고르면 그 단계만(dry-run·부분 재개용)."
        required: false
        default: all
        type: choice
        options: [all, bootstrap, ssm, infra, provision, rehearsal, cutover, finalize]
      dry_run:
        description: "true 면 파괴적 단계(infra apply·cutover)를 건너뛰고 plan·검증만 한다."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

# 같은 대상 계정 이관은 직렬화(재실행이 앞선 실행을 취소하지 않게 cancel-in-progress:false).
# 그룹을 env 로 잡지 않는다 — dev·prod 는 같은 계정을 공유하므로(단일 EC2 공존), env 로 그룹하면 같은 계정에
# dev·prod 를 동시 딸깍했을 때 계정 단위 단계(tfstate 버킷 생성·core terraform state)가 서로 밟는다. 계정으로 묶어 직렬화한다.
concurrency:
  group: migrate-${{ inputs.target_account_id }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ── 가드: 오발·엉뚱한 계정 방지(입력 검증만, 자격증명 없음). 나머지 job 은 전부 이 job 의 성공에 매인다. ──
  guard:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }} # env 별 secret/vars(AWS_*·EC2_HOST 등) 해석 경계
    steps:
      - name: confirm · 계정번호 형식 검증
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target_account_id }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "MIGRATE" ] || { echo "::error::confirm 이 MIGRATE 가 아니다 — 중단"; exit 1; }
          echo "$TARGET" | grep -Eq '^[0-9]{12}$' || { echo "::error::target_account_id 가 12자리 숫자가 아니다"; exit 1; }
          echo "::notice::guard 통과 — env=${{ inputs.env }} target=$TARGET dry_run=${{ inputs.dry_run }} only=${{ inputs.only }}"

  # ── config: env·계정 파생값을 한 곳에서 계산해 downstream 에 넘긴다(토폴로지 비대칭의 단일 출처). ──
  # only 게이트 없음 — 모든 단계가 이 출력을 소비하므로 항상 돈다.
  config:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      ssm_prefix: ${{ steps.map.outputs.ssm_prefix }}
      db_container: ${{ steps.map.outputs.db_container }}
      db_access: ${{ steps.map.outputs.db_access }}
      app_ip_output: ${{ steps.map.outputs.app_ip_output }}
      image_bucket: ${{ steps.map.outputs.image_bucket }}
      tfstate_bucket: ${{ steps.map.outputs.tfstate_bucket }}
    steps:
      - name: env·계정 파생값 계산
        id: map
        env:
          ENV: ${{ inputs.env }}
          ACCOUNT: ${{ inputs.target_account_id }}
        run: |
          set -euo pipefail
          # dev/prod 토폴로지 비대칭 — dev 는 앱 박스에 DB 동거(SSH 접근), prod 는 별도 DB 박스(SSM 접근).
          if [ "$ENV" = "prod" ]; then
            DB_CONTAINER=piki-prod-mysql; DB_ACCESS=ssm;  APP_IP_OUTPUT=ec2_public_ip
          else
            DB_CONTAINER=piki-mysql;      DB_ACCESS=ssh;  APP_IP_OUTPUT=dev_ec2_public_ip
          fi
          {
            echo "ssm_prefix=/piki-core/$ENV"
            echo "db_container=$DB_CONTAINER"
            echo "db_access=$DB_ACCESS"
            echo "app_ip_output=$APP_IP_OUTPUT"   # 이 env 의 앱 EIP 를 담은 terraform output 이름
            echo "image_bucket=piki-images-$ACCOUNT"
            echo "tfstate_bucket=piki-tfstate-$ACCOUNT"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::config — env=$ENV db=$DB_CONTAINER access=$DB_ACCESS ssm=/piki-core/$ENV"

  # ── migrate-0: 계정 부트스트랩. 여기서 처음 자격증명(부트스트랩 키)을 쓰고 STS 로 계정을 실검증한다. 계정 단위. ──
  bootstrap:
    needs: [guard, config]
    if: ${{ inputs.only == 'all' || inputs.only == 'bootstrap' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - name: AWS 자격 (부트스트랩 키)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: STS — 접속 계정이 target 과 일치하는지 실검증
        env:
          TARGET: ${{ inputs.target_account_id }}
        run: |
          set -euo pipefail
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          [ "$ACTUAL" = "$TARGET" ] || { echo "::error::접속 계정($ACTUAL) != target($TARGET) — 엉뚱한 계정 사고 차단"; exit 1; }
          echo "::notice::STS 확인 — 접속 계정=$ACTUAL"

      - name: tfstate 버킷 (생성은 조건부·보호설정은 항상). 3레포 terraform backend 의 전제.
        env:
          TFSTATE_BUCKET: ${{ needs.config.outputs.tfstate_bucket }}
        run: |
          set -euo pipefail
          # dry_run 이어도 이 버킷은 만든다 — S3 backend 라 버킷이 없으면 infra 의 terraform init·plan 자체가 불가하다.
          # dry_run 이 건너뛰는 건 "되돌리기 어려운 파괴적 변경(infra apply·cutover)"이고, 빈 tfstate 버킷은 그 범주가 아니다.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry_run — tfstate 버킷은 plan 전제라 예외적으로 생성/보정한다(빈 버킷, 저위험)"
          fi
          if aws s3api head-bucket --bucket "$TFSTATE_BUCKET" 2>/dev/null; then
            echo "::notice::tfstate 버킷 이미 존재 — $TFSTATE_BUCKET"
          else
            aws s3api create-bucket --bucket "$TFSTATE_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            echo "::notice::tfstate 버킷 생성 — $TFSTATE_BUCKET"
          fi
          # 보호설정은 생성 여부와 무관하게 항상 적용(멱등) — 기존 버킷에 버저닝이 없으면 state 덮어쓰기·삭제 후 이전 버전 복구가 불가하다.
          aws s3api put-bucket-versioning --bucket "$TFSTATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$TFSTATE_BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "::notice::tfstate 버킷 보호설정 적용(버저닝·퍼블릭차단) — $TFSTATE_BUCKET"

      - name: 키페어 2종 (app·db) — 없으면 생성. 프라이빗 키는 GH secret 으로.
        run: |
          set -euo pipefail
          # TODO(런타임 확정): 키페어 이름은 terraform var.key_name/aws_instance key_name 과 일치해야 한다.
          #   terraform 의 실제 key_name 을 확인해 KEYS 배열을 맞춘다(현재는 명명 규약 추정).
          # TODO(권한): aws ec2 create-key-pair 로 만든 프라이빗 키를 `gh secret set EC2_SSH_KEY` 로 저장하려면
          #   admin:repo scope 토큰(GH_TOKEN)이 필요하다 — 기본 GITHUB_TOKEN 으론 secret 쓰기 불가.
          #   부트스트랩 단계는 사람이 한 번만 도는 구간이라, 키 생성은 워크플로가 하고 secret 등록만 수동으로 두는 편이 안전할 수 있다.
          echo "::warning::bootstrap 키페어/secret 등록은 런타임 확정 필요 — 위 TODO 참조 (#1094)"

  # ── migrate-1: SSM 파라미터 이식 + 계정번호 치환. 계정 단위. ──
  ssm:
    needs: [guard, config, bootstrap]
    if: ${{ always() && needs.guard.result == 'success' && (needs.bootstrap.result == 'success' || needs.bootstrap.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'ssm') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - name: AWS 자격 (부트스트랩 키 — 대상 계정)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: SSM 파라미터 이식 (경로별 복사 + 계정번호 치환)
        env:
          SSM_PREFIX: ${{ needs.config.outputs.ssm_prefix }}
          NEW_ACCOUNT: ${{ inputs.target_account_id }}
        run: |
          set -euo pipefail
          # 메커니즘은 실동작: 소스 계정에서 경로별로 읽어(get-parameters-by-path) 계정번호를 치환한 뒤
          # 대상 계정에 put-parameter 로 쓴다(SecureString 은 타입 유지). 소스가 다른 계정이라 소스 자격이 별도로 필요.
          #
          # TODO(런타임 확정):
          #   1) 소스(구 계정) 자격을 어떻게 줄지 — 별도 프로파일/secret. 대상 자격만으론 소스를 못 읽는다.
          #   2) 이식 대상 경로·개수 실측 — 아래는 알려진 것(S3_BUCKET·S3_PUBLIC_BASE_URL 등 계정번호 포함 값)의 예시.
          #      `aws ssm get-parameters-by-path --path "$SSM_PREFIX" --recursive` 로 실제 인벤토리를 뽑아 대조한다.
          #   3) 치환 규칙: 구 계정번호 → $NEW_ACCOUNT (S3 버킷명·ARN 등에 박힌 값). 치환 후 값 검증.
          echo "::warning::SSM 이식 대상/소스자격은 런타임 확정 필요 — get-parameters-by-path 로 $SSM_PREFIX 인벤토리 실측 (#1094)"

  # ── migrate-2a: core terraform. VPC·subnet·SG·OIDC 등 계정 기반. extractor/renderer 가 이걸 data 소스로 참조하므로 먼저 선다. ──
  # 계정 단위. dry_run 이면 plan 까지만.
  infra_core:
    needs: [guard, config, ssm]
    if: ${{ always() && needs.guard.result == 'success' && (needs.ssm.result == 'success' || needs.ssm.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'infra') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격 (부트스트랩 키)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3

      - name: backend.hcl 생성 (계정 파생) + init
        working-directory: terraform
        env:
          TFSTATE_BUCKET: ${{ needs.config.outputs.tfstate_bucket }}
        run: |
          set -euo pipefail
          # backend.hcl 은 gitignore(계정번호 포함) — backend.hcl.example 의 bucket 키를 대상 계정으로 채워 생성한다.
          # providers.tf 의 backend "s3" 가 key/region/encrypt/use_lockfile 를 이미 갖고, bucket 만 -backend-config 로 주입.
          printf 'bucket = "%s"\n' "$TFSTATE_BUCKET" > backend.hcl
          terraform init -backend-config=backend.hcl -input=false

      - name: plan
        working-directory: terraform
        env:
          ENV: ${{ inputs.env }}
          IMAGE_BUCKET: ${{ needs.config.outputs.image_bucket }}
        run: |
          set -euo pipefail
          # TODO(런타임 확정): core 가 실제로 요구하는 TF_VAR 집합을 plan 출력으로 확정한다(누락 변수는 plan 이 물어본다).
          export TF_VAR_environment="$ENV" TF_VAR_image_bucket_name="$IMAGE_BUCKET"
          terraform plan -input=false -out=tfplan

      - name: apply (dry_run 이면 건너뜀)
        if: ${{ inputs.dry_run == false }}
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan
          echo "::notice::infra apply 완료 — core"

  # ── migrate-2b: extractor·renderer terraform. core 의 VPC·subnet·SG 를 data 소스로 참조한다. ──
  # needs: infra_core — core 의 plan/apply 가 실패하면 여기도 돌지 않는다(max-parallel 은 성공 의존을 만들지 못하므로 job 을 분리).
  infra_apps:
    needs: [guard, config, infra_core]
    if: ${{ needs.infra_core.result == 'success' && (inputs.only == 'all' || inputs.only == 'infra') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    strategy:
      fail-fast: false # extractor 실패가 renderer plan 을 못 보게 막지 않는다(둘은 서로 독립)
      matrix:
        include:
          - { repo: extractor, path: infra/extractor, checkout: TeamPiKi/extractor }
          - { repo: renderer, path: infra/headless-browser, checkout: TeamPiKi/renderer }
    steps:
      - name: checkout (${{ matrix.repo }})
        uses: actions/checkout@v4
        with:
          # TODO(런타임 확정): extractor/renderer 의 실제 GitHub repo 슬러그를 확인해 matrix.checkout 을 맞춘다.
          #   타 레포 checkout 은 그 레포 read 권한이 있는 토큰이 필요하다(org 기본 GITHUB_TOKEN 은 자기 레포만).
          repository: ${{ matrix.checkout }}

      - name: AWS 자격 (부트스트랩 키)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3

      - name: backend.hcl 생성 (계정 파생) + init
        working-directory: ${{ matrix.path }}
        env:
          TFSTATE_BUCKET: ${{ needs.config.outputs.tfstate_bucket }}
        run: |
          set -euo pipefail
          printf 'bucket = "%s"\n' "$TFSTATE_BUCKET" > backend.hcl
          terraform init -backend-config=backend.hcl -input=false

      - name: plan
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          # extractor/renderer 는 name_prefix·data 소스 기본값을 쓴다(TF_VAR 없음).
          # dry_run(plan-only)에서는 core 가 아직 apply 전이라 data 소스(VPC/SG) 조회가 실패할 수 있다 — 첫 이관은 not-dry_run 으로 core apply 후 이 job 이 돈다.
          # TODO(런타임 확정): 각 레포가 실제로 요구하는 TF_VAR 를 plan 출력으로 확정한다.
          terraform plan -input=false -out=tfplan

      - name: apply (dry_run 이면 건너뜀)
        if: ${{ inputs.dry_run == false }}
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan
          echo "::notice::infra apply 완료 — ${{ matrix.repo }}"

  # ── migrate-3: provision. 컷오버 밖에서 며칠 앞서. env 단위. 박스별 접근 경로(ssh/ssm)로 갈려 병렬. ──
  provision:
    needs: [guard, config, infra_core, infra_apps]
    if: ${{ always() && needs.guard.result == 'success' && (needs.infra_core.result == 'success' || needs.infra_core.result == 'skipped') && (needs.infra_apps.result == 'success' || needs.infra_apps.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'provision') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    strategy:
      fail-fast: false
      matrix:
        # env 축과 교차: 그 env 의 박스만 provision. 접근 경로로 갈린다.
        #   app  = SSH (dev: dev EIP / prod: prod EIP). provision-runtime.sh 재사용.
        #   db   = dev 는 app 박스 동거라 app provision 에 흡수(별도 없음) / prod 는 SSM(별도 박스). provision-db.sh 재사용.
        #   extractor/renderer = SSM.
        include:
          - { box: app, access: ssh }
          - { box: db, access: ssm }
          - { box: extractor, access: ssm }
          - { box: renderer, access: ssm }
    steps:
      - uses: actions/checkout@v4 # provision-*.sh 를 러너로 가져와 대상 박스에 전달

      - name: AWS 자격 (OIDC — infra 가 만든 배포 역할)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: provision ${{ matrix.box }} (${{ matrix.access }}) — env=${{ inputs.env }}
        env:
          ENV: ${{ inputs.env }}
          DB_ACCESS: ${{ needs.config.outputs.db_access }}
          APP_IP_OUTPUT: ${{ needs.config.outputs.app_ip_output }}
        run: |
          set -euo pipefail
          # dev 는 DB 가 app 박스 동거라 별도 db provision 을 건너뛴다(app provision 이 흡수).
          if [ "${{ matrix.box }}" = "db" ] && [ "$DB_ACCESS" = "ssh" ]; then
            echo "::notice::dev 는 DB 가 app 박스 동거 — 별도 db provision 생략"
            exit 0
          fi
          case "${{ matrix.access }}" in
            ssh)
              # TODO(런타임 확정): 앱 박스 접속. 대상 IP = terraform output "$APP_IP_OUTPUT"(dev_ec2_public_ip|ec2_public_ip).
              #   terraform init(backend) 후 `terraform output -raw "$APP_IP_OUTPUT"` 로 IP 를 읽고,
              #   secrets.EC2_SSH_KEY 로 SSH 해 infra/scripts/provision-runtime.sh 를 실행(멱등: docker·nginx·certbot).
              #   dev app 박스면 여기에 provision-db.sh(--skip-alloy 등)도 이어 돌려 동거 DB 를 함께 세운다.
              echo "::warning::app provision(SSH)은 런타임 확정 필요 — terraform output IP + provision-runtime.sh 전달 (#1095)" ;;
            ssm)
              # TODO(런타임 확정): SSM Run Command 대상 instance-id. 현재 terraform outputs 에 db/extractor/renderer 의
              #   instance-id output 이 없다(private/public IP 만 있음) — outputs.tf 에 instance id 를 추가하거나
              #   태그로 `aws ssm send-command --targets Key=tag:Name,Values=...` 로 찾는다.
              #   그 뒤 provision-db.sh / 각 박스 provision 스크립트를 SSM document(AWS-RunShellScript)로 실행.
              echo "::warning::${{ matrix.box }} provision(SSM)은 런타임 확정 필요 — instance-id/태그 + SSM RunShellScript (#1095)" ;;
          esac

  # ── migrate-4: 리허설. 무중단 덤프 → 복원 → URL재작성 → 행수 대조. env 단위(dev 데이터로 먼저). 라이브 무영향(읽기전용 덤프). ──
  rehearsal:
    needs: [guard, config, provision]
    if: ${{ always() && needs.guard.result == 'success' && (needs.provision.result == 'success' || needs.provision.result == 'skipped') && (inputs.only == 'all' || inputs.only == 'rehearsal') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: rehearsal — 덤프→복원→URL재작성→대조 (env=${{ inputs.env }})
        env:
          DB_CONTAINER: ${{ needs.config.outputs.db_container }}
          DB_ACCESS: ${{ needs.config.outputs.db_access }}
          SSM_PREFIX: ${{ needs.config.outputs.ssm_prefix }}
          OLD_IMAGE_BUCKET: piki-images-996918499382 # 현재(구) 계정 버킷 — safeLog 아닌 상수, 갱신 시 수정
          NEW_IMAGE_BUCKET: ${{ needs.config.outputs.image_bucket }}
        run: |
          set -euo pipefail
          # 흐름(db-backup.sh 계열 재사용): --single-transaction mysqldump(무락) → gzip → 신 계정 박스로 복원 →
          #   이미지 URL 재작성 → S3 이미지 sync(구→신) → 행수 대조. artifact 경유 금지, S3 경유(민감데이터).
          #
          # TODO(런타임 확정):
          #   1) 소스 덤프 접근: dev=app 박스 SSH 로 `docker exec $DB_CONTAINER mysqldump ...`,
          #      prod=별도 DB 박스 SSM RunShellScript. 자격은 SSM_PREFIX 아래 파라미터(db-host/user/pass)에서.
          #   2) URL 재작성 대상 컬럼: 이미지 URL 이 박힌 컬럼 4개를 실측 확정(item_snapshot.image 등).
          #      UPDATE ... SET col = REPLACE(col,'$OLD_IMAGE_BUCKET','$NEW_IMAGE_BUCKET') — 대상 테이블/컬럼은 스키마로 확정.
          #   3) 대조: 덤프 전/복원 후 주요 테이블 COUNT(*) 일치 검증.
          echo "::warning::rehearsal 덤프/URL재작성 대상은 런타임 확정 필요 — 컬럼 4개·소스접근·대조 (#1096)"

  # ── migrate-5/6: 컷오버. 유일한 다운타임 구간. 파괴적이라 dry_run 이면 통째 건너뜀. dev 로 먼저 카나리 후 prod. ──
  cutover:
    needs: [guard, config, rehearsal]
    if: ${{ always() && needs.guard.result == 'success' && (needs.rehearsal.result == 'success' || needs.rehearsal.result == 'skipped') && inputs.dry_run == false && (inputs.only == 'all' || inputs.only == 'cutover') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: cutover — freeze→델타덤프/복원→배포→검증→해제 (env=${{ inputs.env }})
        env:
          ENV: ${{ inputs.env }}
          APP_IP_OUTPUT: ${{ needs.config.outputs.app_ip_output }}
        run: |
          set -euo pipefail
          # 순서: (a) DNS 준비 확인 → (b) 서비스 freeze(쓰기 차단) → (c) 최종 델타 덤프/복원 + S3 델타 sync →
          #   (d) 신 계정 앱 배포 → (e) 스모크 검증 → (f) DNS 전환 → (g) freeze 해제.
          # 롤백: DNS 를 구 계정 EIP 로 원복(전환 전이면 무영향). freeze 만 걸고 전환 안 했으면 해제로 원복.
          #
          # TODO(런타임 확정):
          #   1) DNS: #1100 전제. 가비아면 수동(폴링 대기), Cloudflare 이관 후면 CF API 로 A 레코드 전환.
          #      대상 = terraform output "$APP_IP_OUTPUT"(신 계정 EIP).
          #   2) freeze 수단: 앱 read-only 전환 or nginx 503 페이지 — 실제 수단 확정(현재 배포 스크립트에 freeze 훅 없음).
          #   3) 배포: 기존 deploy.yml 재사용 경로(workflow dispatch or 스크립트) 확정.
          #   4) 검증: /actuator/health + 핵심 엔드포인트 스모크. 실패 시 즉시 롤백.
          echo "::warning::cutover 각 단계는 런타임 확정 필요 — DNS/freeze/배포/검증/롤백 (#1097)"

  # ── 마무리: 결과 요약. 앞 단계 결과와 무관하게 항상 요약을 남긴다. ──
  finalize:
    needs: [guard, config, bootstrap, ssm, infra_core, infra_apps, provision, rehearsal, cutover]
    if: ${{ always() && (inputs.only == 'all' || inputs.only == 'finalize') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - name: 요약
        run: |
          echo "### 이관 요약 (env=${{ inputs.env }}, dry_run=${{ inputs.dry_run }}, only=${{ inputs.only }})" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| bootstrap | ${{ needs.bootstrap.result }} |"
            echo "| ssm | ${{ needs.ssm.result }} |"
            echo "| infra_core | ${{ needs.infra_core.result }} |"
            echo "| infra_apps | ${{ needs.infra_apps.result }} |"
            echo "| provision | ${{ needs.provision.result }} |"
            echo "| rehearsal | ${{ needs.rehearsal.result }} |"
            echo "| cutover | ${{ needs.cutover.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::finalize — 단계별 소요·다운타임·URL재작성 건수·행수 대조 기록은 #1098"
